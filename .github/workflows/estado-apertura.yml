name: Estado para abrir

# Qué está listo para abrir, verificado contra producción: secrets (solo nombres), lo que recibe
# el cliente (píxel, Google, horario, carta, inventario) y los pedidos que hay en la base.
on:
  workflow_dispatch:

jobs:
  estado:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Revisar
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/estado-apertura.mjs
