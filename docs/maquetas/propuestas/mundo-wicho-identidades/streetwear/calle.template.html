<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arma el tuyo</title>
<style>
@font-face{font-family:'Cond';font-style:italic;font-weight:900;src:url(data:font/woff2;base64,__F_COND9__) format('woff2')}
@font-face{font-family:'Cond';font-style:italic;font-weight:800;src:url(data:font/woff2;base64,__F_COND8__) format('woff2')}
@font-face{font-family:'Bar';font-weight:500;src:url(data:font/woff2;base64,__F_BAR5__) format('woff2')}
@font-face{font-family:'Bar';font-weight:700;src:url(data:font/woff2;base64,__F_BAR7__) format('woff2')}
:root{--n:#0B0B0B;--b:#F2F0EB;--r:#FF3B1F;--g:#4A4844;--g2:#9A968F;--l:#2A2826}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#000}
body{display:flex;justify-content:center;font-family:'Bar';font-weight:500;color:var(--b)}
.app{position:relative;width:100%;max-width:430px;min-height:100vh;background:var(--n);padding-bottom:96px}
.c{font-family:'Cond';font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:-.01em}
.k{font-family:'Bar';font-weight:700;font-size:11px;letter-spacing:.18em;text-transform:uppercase}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left;text-transform:inherit;letter-spacing:inherit}
.hero{position:relative;height:536px;overflow:hidden}
.hero .ph{position:absolute;inset:0;background-size:cover;background-position:center 30%;filter:contrast(1.12) saturate(1.05);transition:opacity .35s}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,11,.5) 0%,rgba(11,11,11,0) 25%,rgba(11,11,11,0) 50%,#0B0B0B 86%)}
.top{position:absolute;left:18px;right:18px;top:16px;display:flex;justify-content:space-between;z-index:2}
.kick{position:absolute;left:18px;top:296px;background:var(--r);color:var(--n);padding:5px 9px;z-index:2}
.ej{position:absolute;right:18px;top:298px;font-size:9px;color:var(--g2);z-index:2}
.big{position:absolute;left:14px;top:326px;font-size:112px;line-height:.82;z-index:2}
.big span{color:var(--r)}
.tabs{display:flex;gap:18px;font-size:28px;white-space:nowrap;overflow-x:auto;padding:4px 18px 2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{color:var(--g);padding-bottom:2px;border-bottom:5px solid transparent}
.tab.on{color:var(--b);border-color:var(--r)}
.precioP{padding:6px 18px 0;color:var(--g2)}
.sec{padding:26px 18px 0}
.sec h2{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.sec h2 .c{font-size:15px;letter-spacing:.02em}
.lista{columns:2;column-gap:14px}
.it{display:block;width:100%;font-size:24px;line-height:1.12;break-inside:avoid;padding:1px 0}
.it.off{color:var(--g);text-decoration:line-through;text-decoration-thickness:4px;text-decoration-color:var(--r)}
.it small{font-family:'Bar';font-weight:700;font-style:normal;font-size:9px;letter-spacing:.14em;color:var(--r);vertical-align:middle;margin-left:4px}
.agr .it{color:var(--g2);font-size:20px}
.agr .it::before{content:"+ ";color:var(--r)}
.agr .it.lleno{opacity:.35}
.nota{margin-top:10px;color:var(--g2)}
.panes{display:flex;gap:10px}
.pan{flex:1;height:56px;border:2px solid var(--g);display:flex;align-items:center;justify-content:center;gap:8px;font-size:24px;color:var(--g2)}
.pan.on{border-color:var(--b);background:var(--b);color:var(--n)}
.pan small{font-family:'Bar';font-weight:700;font-style:normal;font-size:9px;letter-spacing:.14em;color:var(--r)}
.fila{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px 0;border-top:1px solid var(--l);font-size:24px}
.fila .s{display:block;font-family:'Bar';font-style:normal;font-weight:700;font-size:9px;letter-spacing:.16em;color:var(--g2);margin-top:4px}
.sw{width:54px;height:30px;border:2px solid var(--g);position:relative;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;background:var(--g);transition:left .2s,background .2s}
.sw.on{border-color:var(--r)}.sw.on::after{left:27px;background:var(--r)}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;height:78px;display:flex;z-index:9;background:var(--n)}
.sz{width:150px;display:flex;align-items:center;justify-content:center;gap:12px;border-top:1px solid var(--l)}
.sz button{font-size:40px;color:transparent;-webkit-text-stroke:1.5px #6A6762}
.sz button.on{color:var(--b);-webkit-text-stroke:0}
.go{flex:1;background:var(--r);color:var(--n);display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:26px;white-space:nowrap}
.go:active{filter:brightness(.92)}
.toast{position:fixed;left:50%;bottom:94px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--b);color:var(--n);padding:10px 14px;z-index:10;transition:.25s;white-space:nowrap}
.toast.ver{opacity:1;transform:translateX(-50%)}
</style></head><body>
<div class="app">
  <div class="hero"><div class="ph" id="ph"></div>
    <div class="top k"><button data-accion="armador-atras">← Volver</button><span>Arma el tuyo</span><button data-accion="y-ademas">Y además</button></div>
    <div class="kick k">Edición: la tuya</div><div class="ej k">foto de ejemplo</div>
    <div class="big c">Con<br>todo<span>.</span></div>
  </div>
  <div class="tabs c" id="tabs"></div>
  <div class="precioP k" id="pp"></div>

  <div class="sec"><h2><span class="c">El pan</span><span class="k" style="color:var(--g2)">siempre lleva uno</span></h2>
    <div class="panes" id="panes"></div></div>

  <div class="sec"><h2><span class="c">Lo que lleva</span><span class="k" style="color:var(--g2)">tócalo para quitarlo</span></h2>
    <div class="lista" id="lleva"></div><div class="nota k" id="nota"></div></div>

  <div class="sec agr"><h2><span class="c">Agrégale</span><span class="k" id="cuentaS" style="color:var(--g2)"></span></h2>
    <div class="lista" id="agrega"></div></div>

  <div class="sec">
    <button class="fila c" id="doble" data-accion="armador-doble"><span><span id="dobleT">Doble res</span><span class="s" id="dobleS"></span></span><span class="sw" id="dobleSw"></span></button>
    <button class="fila c" data-accion="pedido-grupal"><span>¿Son varios?<span class="s">cada uno arma el suyo · el que organiza, gratis desde 5</span></span><span>→</span></button>
    <button class="fila c" data-accion="ir-a-sando"><span>¿Ya resuelto?<span class="s">Philly Cheesesteak · la estrella de SANDO</span></span><span>→</span></button>
    <button class="fila c" data-accion="secreto"><span>El secreto<span class="s">ya se te abrió · no preguntes qué lleva</span></span><span>→</span></button>
  </div>

  <div class="bar c"><div class="sz"><button id="s15" class="on" data-accion="tamano-15">15</button><button id="s30" data-accion="tamano-30">30</button></div>
    <button class="go" id="go" data-accion="armador-agregar"><span>Lo quiero</span><span id="total"></span></button></div>
  <div class="toast k" id="toast"></div>
</div>
<script>
const FOTOS=__FOTOS__;
const PROT=[{id:'P09',n:'Res',p:{15:19.9,30:30.9},d:{15:7,30:13.9},f:'HERO'},{id:'P04',n:'Atún',p:{15:19.9,30:30.9},d:{15:10.9,30:21.9},f:'P04'},
 {id:'P06',n:'Albóndiga',p:{15:19.9,30:30.9},d:{15:6.9,30:13.9},f:'P06'},{id:'P08',n:'Pavo',p:{15:19.9,30:30.9},d:{15:9,30:17},f:'P08'},
 {id:'P05',n:'Embutido',p:{15:16.9,30:32.9},d:{15:9.9,30:19.9},f:'P05'}];
// «Con todo» (propuesta: la confirma el dueño). Lo picante nunca viene puesto.
const TODO=[{id:'C02',n:'Cheddar',g:'queso'},{id:'T01',n:'Tomate',g:'veg'},{id:'T09',n:'Lechuga',g:'veg'},{id:'T03',n:'Cebolla morada',g:'veg'},
 {id:'T11',n:'Pepinillo',g:'veg'},{id:'T02',n:'Pickles',g:'veg'},{id:'T06',n:'Pimiento',g:'veg'},{id:'S13',n:'Mayonesa',g:'salsa'},{id:'S04',n:'Honey mustard',g:'salsa'}];
const PANES=[{id:'B01',n:'Classic',x:'',rec:{15:0,30:0}},{id:'B03',n:'Focaccia',x:'+S/0.50',rec:{15:.5,30:1}}];
const EXTRA=[{id:'C01',n:'Americano',g:'queso'},{id:'T10',n:'Cebolla salteada',g:'veg'},{id:'T04',n:'Jalapeño',g:'veg',pica:1},
 {id:'S15',n:'Ketchup',g:'salsa'},{id:'S14',n:'Mayonesa light',g:'salsa'},{id:'S06',n:'Oil & vinegar',g:'salsa'},{id:'S09',n:'Chimichurri',g:'salsa',pica:1}];
const st={p:'P09',t:15,pan:'B01',doble:false,quit:new Set(),agr:new Set()};
const $=(i)=>document.getElementById(i);
const fmt=(n)=>'S/'+n.toFixed(2);
function salsas(){return TODO.filter(x=>x.g==='salsa'&&!st.quit.has(x.id)).length+EXTRA.filter(x=>x.g==='salsa'&&st.agr.has(x.id)).length;}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('ver');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('ver'),1600);}
function total(){const pr=PROT.find(x=>x.id===st.p);let v=pr.p[st.t];if(st.doble)v+=pr.d[st.t];
  // Un solo pan y un solo queso: elegir el de «agrégale» reemplaza al que viene.
  v+=PANES.find(x=>x.id===st.pan).rec[st.t];return v;}
function pinta(){
  const pr=PROT.find(x=>x.id===st.p);
  $('ph').style.backgroundImage=`url(${FOTOS[pr.f]})`;
  $('tabs').innerHTML=PROT.map(x=>`<button class="tab${x.id===st.p?' on':''}" data-id="${x.id}" data-accion="armador-proteina">${x.n}</button>`).join('');
  $('pp').textContent=`${pr.n} · ${st.t} cm · desde ${fmt(pr.p[st.t])}`;
  $('panes').innerHTML=PANES.map(x=>`<button class="pan c${x.id===st.pan?' on':''}" data-id="${x.id}" data-accion="armador-pan">${x.n}${x.x?`<small>${x.x}</small>`:''}</button>`).join('');
  $('lleva').innerHTML=TODO.map(x=>`<button class="it c${st.quit.has(x.id)?' off':''}" data-id="${x.id}" data-accion="armador-quitar">${x.n}</button>`).join('');
  $('agrega').innerHTML=EXTRA.map(x=>{const on=st.agr.has(x.id);const lleno=x.g==='salsa'&&!on&&salsas()>=3;return `<button class="it c${lleno?' lleno':''}" style="${on?'color:var(--b)':''}" data-id="${x.id}" data-accion="armador-agregar-ing">${on?'✓ ':''}${x.n}${x.x?`<small>${x.x}</small>`:''}${x.pica?'<small>pica</small>':''}</button>`;}).join('');
  const q=TODO.filter(x=>st.quit.has(x.id)).map(x=>x.n.toLowerCase());
  $('nota').textContent=q.length?`Sin ${q.join(', ')}.`:'Así viene. Tacha lo que no quieras.';
  $('cuentaS').textContent=`salsas ${salsas()}/3 incluidas`;
  $('dobleT').textContent='Doble '+pr.n.toLowerCase(); $('dobleS').textContent='+'+fmt(pr.d[st.t]); $('dobleSw').classList.toggle('on',st.doble);
  $('s15').classList.toggle('on',st.t===15); $('s30').classList.toggle('on',st.t===30);
  $('total').textContent=fmt(total())+' →';
}
document.addEventListener('click',(e)=>{
  const b=e.target.closest('button'); if(!b) return; const a=b.dataset.accion, id=b.dataset.id;
  if(a==='armador-proteina'){st.p=id;st.doble=false;}
  else if(a==='armador-quitar'){st.quit.has(id)?st.quit.delete(id):st.quit.add(id); if(!st.quit.has(id)){const x=TODO.find(y=>y.id===id); if(x.g==='salsa'&&salsas()>3){st.quit.add(id);toast('Ya llevas 3 salsas');}}}
  else if(a==='armador-agregar-ing'){const x=EXTRA.find(y=>y.id===id);
    if(st.agr.has(id)) st.agr.delete(id);
    else{ if(x.g==='salsa'&&salsas()>=3){toast('Hasta 3 salsas incluidas');return;}
      if(x.g==='queso'){ // reemplaza al que viene
        const base=TODO.find(y=>y.g===x.g); st.quit.add(base.id); EXTRA.filter(y=>y.g===x.g).forEach(y=>st.agr.delete(y.id)); }
      st.agr.add(id); }}
  else if(a==='armador-pan'){st.pan=id;}
  else if(a==='armador-doble'){st.doble=!st.doble;}
  else if(a==='tamano-15'){st.t=15;} else if(a==='tamano-30'){st.t=30;}
  else if(a==='armador-agregar'){toast('Listo: '+PROT.find(x=>x.id===st.p).n+' '+st.t+' cm al carrito');return;}
  else return;
  pinta();
});
pinta();
</script></body></html>
