<h2>Pedido en grupo — la puerta y el plato, segunda vuelta</h2>
<p class="sub">La puerta queda como está: el grupo entra en el pie como una línea más (A) o como una píldora chica arriba, espejo de «Entrar» (B). En las dos, la línea legal va en letra chica al fondo del pie. En el plato, SANDO ya no se ve enojado.</p>
<div class="fila">
<figure><div class="hueco"><div class="tel"><img class="base" src="base/01-puerta.png">
 <div class="pie nuevo"><div class="a">Abierto ahora <em>cierra 12:00 a.m. · delivery desde S/5</em></div><div class="g">¿Son varios? Pedido en grupo →</div><div class="l">Libro de Reclamaciones · Términos · Contacto</div></div></div></div>
 <figcaption><b>A · Una línea en el pie</b><span>Debajo de «Abierto ahora», en celeste, del mismo tamaño que el resto del pie. La puerta no cambia.</span></figcaption></figure>
<figure><div class="hueco"><div class="tel"><img class="base" src="base/01-puerta.png">
 <div class="pildora nuevo">En grupo →</div>
 <div class="pie"><div class="a">Abierto ahora <em>cierra 12:00 a.m. · delivery desde S/5</em></div><div class="l nuevo" style="margin-top:12px">Libro de Reclamaciones · Términos · Contacto</div></div></div></div>
 <figcaption><b>B · Una píldora arriba</b><span>Arriba a la izquierda, en el lado de SANDO, espejo de «Entrar →» a la derecha. Lo más discreto.</span></figcaption></figure>
<figure><div class="hueco"><div class="tel"><div class="plato"><div class="forro"></div><div class="riel">SND//WCH</div>
 <div class="dos"><img src="../../../img/sando2_cuerpo.png"><img src="../../../img/wicho2_celebra.png"></div>
 <div class="ficha"><div class="num">Para varios</div><h1>Pedido en grupo</h1>
 <p>Mandas un enlace y cada uno elige el suyo desde su celular, Signature o armado. Tú pagas una vez y llega todo junto.</p>
 <div class="regla">Desde 5 sándwiches, el más barato va gratis</div>
 <div class="cuenta"><u>O llénalo tú: pack de 5</u><button>Armar el grupo</button></div></div></div></div></div>
 <figcaption><b>2 · El plato del grupo</b><span>SANDO de cuerpo entero, tranquilo y con las manos en los bolsillos (su pose aprobada), junto a WICHO celebrando. Va segundo en el Mundo SANDO.</span></figcaption></figure>
