<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Fondo del Mundo SANDO — alternativas</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@600&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Fraunces:wght@600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9E4D8;font-family:'EB Garamond',serif;padding:36px 28px}
h2{font:600 28px/1.1 'Bodoni Moda',serif;margin:0 0 6px;color:#1b1b1b} .sub{margin:0 0 26px;color:#555;font-size:15px;max-width:none}
.fila{display:flex;gap:26px}
figure{margin:0;width:300px}
.tel{position:relative;width:300px;height:650px;background:var(--bg);overflow:hidden;border-radius:20px}
.foto{position:absolute;left:0;right:0;top:0;height:60%} .foto img{width:100%;height:100%;object-fit:cover}
.baja{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,transparent 28%,transparent 62%,var(--bg) 100%)}
.forro{position:absolute;left:0;top:0;bottom:0;width:6px;background:#D8823C}
.riel{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:12px 14px;color:#F7F4EA;font:600 11px 'Fraunces',serif}
.riel b{display:flex;align-items:center;gap:.16em} .riel i{display:inline-block;width:.10em;height:.88em;transform:skewX(-16deg);border-radius:1px} .riel .a{background:#CBA258} .riel .b{background:#8CC8EC}
.sirve{position:absolute;right:8px;top:calc(60% - 120px);width:84px}
.ficha{position:absolute;left:18px;right:16px;bottom:22px}
.num{font-size:9px;letter-spacing:.3em;color:var(--num);text-transform:uppercase} .num em{font-style:normal;color:#D8823C;margin-left:8px}
h1{font:600 34px/.96 'Bodoni Moda',serif;color:#F7F4EA;margin:10px 0 0}
p{font-size:12px;line-height:1.5;color:var(--pitch);max-width:30ch;margin:10px 0 0}
.puno{height:7px;margin:14px 0 12px;background:var(--puno);background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.45) 0 2px,transparent 2px 6px)}
.cuenta{display:flex;justify-content:space-between;align-items:flex-end}
.p{font:600 30px/.9 'Bodoni Moda',serif;color:#CBA258} .p s{display:block;text-decoration:none;font:11px 'EB Garamond';color:var(--sub);margin-top:6px}
button{border:0;background:#CBA258;color:var(--bg);padding:12px 20px;font:600 13px 'Bodoni Moda',serif}
.pasar{display:flex;gap:6px;margin-top:18px} .pasar i{flex:1;height:3px;background:var(--pasar)} .pasar i.on{background:#F7F4EA}
figcaption{margin-top:12px} figcaption b{display:block;font:600 18px 'Bodoni Moda',serif;color:#1b1b1b} figcaption span{display:block;font-size:14px;color:#444;margin-top:4px;line-height:1.35} figcaption code{font-size:11px;color:#777}
</style></head><body>
