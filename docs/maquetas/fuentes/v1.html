<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#2a2a2a;padding:22px;display:flex;gap:20px}
.f{width:372px;height:812px;position:relative;overflow:hidden;background:#8CC8EC}
.tag{position:absolute;top:0;left:0;z-index:60;background:#000;color:#fff;font:600 10px/1 Archivo,sans-serif;letter-spacing:.14em;padding:6px 10px}
.bS{position:absolute;left:0;top:0;bottom:0;width:8px;background:#D8823C;z-index:55}
.bW{position:absolute;right:0;top:0;bottom:0;width:8px;background:#8CC8EC;z-index:55}
.topo{position:absolute;inset:0;width:100%;height:100%;opacity:.6;z-index:0}
.f>*{position:relative;z-index:1}
.sal{position:absolute;top:18px;left:24px;font-size:20px;color:#15242D;z-index:9}
/* ÉL ES EL ESTADO. No hay barra de progreso: su cara y su pose dicen dónde estás. */
.wicho{position:absolute;right:-30px;bottom:88px;width:186px;z-index:4;
  filter:drop-shadow(-8px 12px 22px rgba(21,36,45,.3))}
/* y sostiene la cosa: el premio no flota, se lo está ofreciendo */
.premio{position:absolute;left:22px;top:298px;width:174px;height:174px;overflow:hidden;z-index:6;
  border:7px solid #FBF6EE;box-shadow:0 14px 30px rgba(21,36,45,.34);transform:rotate(-3deg)}
.premio img{width:100%;height:100%;object-fit:cover;display:block}
.dice{position:absolute;left:22px;right:24px;top:64px;z-index:7}
.dice em{font-style:normal;font:700 10px/1 Archivo,sans-serif;letter-spacing:.3em;color:#4A3D62;text-transform:uppercase}
.dice b{display:block;font-family:Anton,sans-serif;font-size:38px;color:#15242D;text-transform:uppercase;line-height:.86;margin-top:12px}
.dice p{font-family:'EB Garamond',serif;font-style:italic;font-size:17px;color:#25404F;margin-top:14px;line-height:1.35}
/* lo que falta, contado en pedidos — cinco marcas de tinta, no una barra */
.marcas{position:absolute;left:22px;top:500px;display:flex;gap:9px;z-index:7}
.marcas i{width:38px;height:38px;border:3px solid rgba(21,36,45,.3);border-radius:999px;display:flex;
  align-items:center;justify-content:center;font-family:Anton,sans-serif;font-size:16px;color:rgba(21,36,45,.3);font-style:normal}
.marcas i.ok{background:#4A3D62;border-color:#4A3D62;color:#F3EAF9;transform:rotate(-5deg)}
.otras{position:absolute;left:22px;right:170px;top:568px;z-index:7}
.otras .r{font:700 9px/1 Archivo,sans-serif;letter-spacing:.3em;color:#4A3D62;text-transform:uppercase}
.otras .g{display:flex;align-items:baseline;gap:12px;padding:12px 0;border-bottom:1px solid rgba(21,36,45,.18)}
.otras .g .n{flex:1;font-family:'EB Garamond',serif;font-size:15.5px;color:#25404F}
.otras .g .d{font-family:Anton,sans-serif;font-size:16px;color:#4A3D62}
.otras .g.ya .n{color:#15242D;font-weight:600}
.otras .g.ya .d{font:700 10px/1 Archivo,sans-serif;letter-spacing:.14em;color:#4A3D62}
.go{position:absolute;left:22px;right:22px;bottom:34px;background:#4A3D62;color:#FBF6EE;text-align:center;
  padding:18px 0;font:700 12px/1 Archivo,sans-serif;letter-spacing:.16em;text-transform:uppercase;z-index:7}

.frase{position:absolute;left:214px;right:24px;top:310px;z-index:7;font-family:'EB Garamond',serif;
  font-style:italic;font-size:16px;color:#25404F;line-height:1.35}
