<!doctype html><html><head><meta charset="utf-8">
<style>
/* SND//WCH — un Reel/TikTok de 12 s, 1080×1920, dibujado por render(t). Todo texto viene de datos.json. */
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#1a130b}
#v{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Archivo,sans-serif;color:#FBF4E6}
#foto{position:absolute;inset:0;background-size:cover;background-position:center;will-change:transform}
#velo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(26,19,11,.55) 0%,rgba(26,19,11,0) 30%,rgba(26,19,11,0) 55%,rgba(26,19,11,.85) 100%)}
.cap{position:absolute;left:72px;right:72px;font:400 120px/0.95 Anton,sans-serif;text-transform:uppercase;letter-spacing:-.01em}
#gancho{top:200px;font-size:96px;line-height:1.02}
#nombre{bottom:560px;right:72px}
#chips{position:absolute;left:72px;right:400px;bottom:300px;display:flex;flex-wrap:wrap;gap:16px}
.chip{font:600 34px/1 'IBM Plex Mono',monospace;background:#FBF4E6;color:#33230F;padding:16px 22px;border-radius:12px;opacity:0}
#precio{position:absolute;right:72px;top:820px;transform:rotate(-6deg);border:8px solid #FBF4E6;padding:18px 28px 10px;text-align:center;opacity:0}
#precio b{display:block;font:400 110px/1 Anton,sans-serif}#precio s{text-decoration:none;font:600 30px/1 'IBM Plex Mono',monospace;letter-spacing:.2em}
#sando{position:absolute;right:-30px;bottom:-40px;width:430px}
#cta{position:absolute;inset:0;background:#1F1609;color:#FBF4E6;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:40px;opacity:0}
#cta .wm{font:800 120px/1 Archivo,sans-serif;display:flex;align-items:center}
.mk{display:inline-flex;gap:.16em;margin:0 .1em}.mk i{width:.10em;height:.88em;transform:skewX(-16deg);border-radius:1px;display:block}
.mk i:first-child{background:#CBA258}.mk i:last-child{background:#8CC8EC}
#cta .url{font:600 56px/1 'IBM Plex Mono',monospace;background:#FBF4E6;color:#1F1609;padding:24px 36px;border-radius:12px}
#cta .sub{font:600 36px/1.3 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;text-align:center}
#wicho{position:absolute;right:40px;bottom:120px;width:380px}
</style></head><body><div id="v">
<div id="foto"></div><div id="velo"></div>
<div class="cap" id="gancho"></div>
<div id="precio"><b></b><s>15CM</s></div>
<div class="cap" id="nombre"></div>
<div id="chips"></div>
<img id="sando" src="../../img/sando2_sonrie.png" alt="">
<div id="cta"><div class="wm">SND<span class="mk"><i></i><i></i></span>WCH</div><div class="url">sndwch.app</div><div class="sub">Pídelo hoy · delivery</div><img id="wicho" src="../../img/wicho_rie.png" alt=""></div>
</div>
<script>
const D = window.DATOS;
const $ = (id) => document.getElementById(id);
const precio = (n) => 'S/' + (Number.isInteger(n) ? n : n.toFixed(2));
$('foto').style.backgroundImage = `url(../../${D.foto})`;
$('gancho').textContent = D.gancho;
$('nombre').textContent = D.nombre;
$('precio').querySelector('b').textContent = precio(D.p15);
$('chips').innerHTML = D.ingredientes.map((x) => `<span class="chip">${x}</span>`).join('');
const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
const tramo = (t, a, b) => ease((t - a) / (b - a));
// render(t): el estado exacto del video en el segundo t. Sin animaciones CSS: así cada cuadro es reproducible.
window.render = (t) => {
  $('foto').style.transform = `scale(${1.25 - 0.18 * tramo(t, 0, 9)}) translateY(${-40 * tramo(t, 0, 9)}px)`;
  $('gancho').style.opacity = 1 - tramo(t, 2.6, 3.1);
  $('gancho').style.transform = `translateY(${60 * (1 - tramo(t, 0, 0.6))}px)`;
  $('nombre').style.opacity = tramo(t, 3, 3.6);
  $('nombre').style.transform = `translateX(${-120 * (1 - tramo(t, 3, 3.6))}px)`;
  [...document.querySelectorAll('.chip')].forEach((c, i) => {
    const a = 3.8 + i * 0.45; c.style.opacity = tramo(t, a, a + 0.3); c.style.transform = `translateY(${30 * (1 - tramo(t, a, a + 0.3))}px)`;
  });
  const p = tramo(t, 6, 6.35); $('precio').style.opacity = p; $('precio').style.transform = `rotate(-6deg) scale(${1.6 - 0.6 * p})`;
  $('sando').style.transform = `translateY(${600 * (1 - tramo(t, 6.6, 7.3))}px) rotate(${6 - 6 * tramo(t, 6.6, 7.3)}deg)`;
  $('cta').style.opacity = tramo(t, 9, 9.4);
  $('wicho').style.transform = `translateY(${500 * (1 - tramo(t, 9.6, 10.2))}px) rotate(${-8 + 8 * tramo(t, 9.6, 10.2)}deg)`;
};
window.render(0);
</script></body></html>
