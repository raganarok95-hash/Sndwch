/* Modo claro del panel admin — antes era filter:invert(1) hue-rotate(180deg) sobre todo
   el contenedor, lo que invertía matemáticamente el dorado de marca (#CBA258) a un olivo
   lavado (hallazgo de auditoría visual). Ahora es una paleta clara de verdad: cada
   superficie/texto neutro del panel admin usa una custom property con el valor oscuro
   actual como fallback (así cualquier pantalla que NO esté dentro de .admin-light se ve
   exactamente igual que antes, cero regresión), y .admin-light solo redefine esas
   properties. Los colores semánticos/de estado (naranja, verde, rojo, azul, morado) se
   dejan sin cambio entre temas — práctica estándar, ya son legibles sobre fondo claro.
   El dorado de marca (variable JS GOLD) se reasigna a un tono más oscuro solo mientras se
   renderiza una pantalla admin en modo claro (ver toggleAdminLight/render en app.ts). */
.admin-light{
  --sw-bg:#F3EEE1;
  --sw-card:#FFFFFF;
  --sw-card2:#F1EBDA;
  --sw-card-danger:#FBEAEA;
  --sw-card-muted:#EAE3D0;
  --sw-border:#D9D0BA;
  --sw-border-soft:#DDD5BE;
  --sw-border-muted:#DCD3BB;
  --sw-text:#241C10;
  --sw-text-body:#3A2F1D;
  --sw-text-muted:#6B6350;
  --sw-text-muted2:#877D68;
  --sw-text-muted3:#9C9480;
  --sw-text-muted4:#4A4230;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#1E3932;min-height:100%;-webkit-tap-highlight-color:transparent}
body{font-family:'Barlow',sans-serif;color:#fff;position:relative;font-variant-numeric:tabular-nums}
.cut-sep{text-shadow:0 0 10px rgba(203,162,88,.4)}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:#1E3932;position:relative;z-index:1}
::-webkit-scrollbar{width:0}
/* Grano sutil sobre el verde oscuro — sin esto el fondo se ve plano en pantallas
   grandes; con esto se siente como una superficie con textura en vez de un color
   sólido de CSS. pointer-events:none + z-index bajo para no interferir con nada. */
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.035;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
input{outline:none;border:none;font-family:'Barlow',sans-serif}
input::placeholder{color:#A8C8B0;font-size:13px}
button{cursor:pointer;border:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.pulse{animation:pulse 1.8s infinite}
/* "Bump" breve al sumar/restar cantidad — como el nodo se recrea en cada render()
   (innerHTML completo), la animación se reproduce sola cada vez sin JS adicional. */
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.bump{animation:bump .25s ease}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.blink{animation:blink 1.4s infinite}
/* Celebración de rango en sOSent() — antes rankName() era puramente informativo, sin
   ningún momento que marcara cruzar un umbral (ej. NUEVO -> REGULAR, o desbloquear THE
   VAULT en DE LA CASA). Un solo "pop" con leve overshoot, nada más — no hace falta
   confetti para que se sienta como un logro. */
@keyframes rankpop{0%{transform:scale(0) rotate(-6deg);opacity:0}60%{transform:scale(1.12) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0deg)}}
.rank-pop{animation:rankpop .5s cubic-bezier(.34,1.56,.64,1)}
@media (prefers-reduced-motion: reduce){.rank-pop{animation:none}}

input,textarea,select{color:#F2F0EB !important}
input::placeholder,textarea::placeholder{color:#A8C8B0 !important;opacity:1}
input:focus,textarea:focus{outline:none;border-color:#CBA258 !important;box-shadow:0 0 0 2px rgba(203,162,88,.15)}
/* Transición de entrada de cada pantalla — antes había dos definiciones
   distintas de .fi (una quedaba muerta, sobreescrita por la segunda);
   se deja una sola. Un leve scale-in además del translateY le da más cuerpo
   al cambio de pantalla sin volverse lento ni notorio como para distraer. */
.fi{animation:fi .32s cubic-bezier(.16,1,.3,1)}
@keyframes fi{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.fi{animation:none}}
/* render() agrega esta clase al body cuando solo se actualiza la pantalla
   actual (ej. tocar un topping) en vez de navegar a una nueva — así la
   animación .fi no se reproduce en cada micro-interacción. */
body.no-fi .fi{animation:none}
/* Feedback táctil sutil en cualquier elemento interactivo (todos marcados con
   cursor:pointer en su style inline) — antes ningún botón/tarjeta daba señal
   visual al presionar, solo cambiaba de pantalla/estado sin transición. */
[style*="cursor:pointer"]{transition:transform .08s ease}
[style*="cursor:pointer"]:active{transform:scale(.97)}
@media (prefers-reduced-motion: reduce){[style*="cursor:pointer"]{transition:none}[style*="cursor:pointer"]:active{transform:none}}
</style>

        var img = new Image();

async function doReg() {

// Callback global de Google Identity Services (google.accounts.id.initialize) — recibe un
// credential (id_token JWT) que NUNCA se usa para iniciar sesión directamente acá: se manda
// al servidor (acción google-auth), que decide si ya existe una cuenta vinculada (login) o
// si falta completar el registro normal con DNI/teléfono/PIN (ver actGoogleAuth).
async function onGoogleCredential(resp) {
    if (!resp || !resp.credential)
        return;
    busy = true;

    render();
    try {
        var r = await api('google-auth', { idToken: resp.credential });
        if (r.needsRegistration) {
            _googleIdToken = resp.credential;

            window._lastGuestName = (r.prefill && r.prefill.name) || '';
            window._lastGuestEmail = (r.prefill && r.prefill.email) || '';
            atab = 'reg';
            aErr = '';
            busy = false;
            render();
            // Antes decía solo "DNI y teléfono" — el formulario también exige un PIN nuevo
            // (mínimo 4 dígitos) para poder crear la cuenta, y quien viene de Google se
            // enteraba de eso recién al tocar CREAR CUENTA (hallazgo de auditoría UX).
            showToast('Ya verificamos tu cuenta de Google — completa DNI, teléfono y crea un PIN para terminar tu registro.');

        }
        cust = r.customer;
        isAdmin = r.isAdmin;
        token = r.token;
        cacheCust(cust, isAdmin);
        localStorage.setItem('sw_ph', cust.phone);
        localStorage.setItem('sw_tok', token);
        savedPh = cust.phone;
        busy = false;
        sc = 'p_home';
        render();
        loadUserExtras();
    }
    catch (e) {
        aErr = e.message;
        busy = false;

async function doCreditGift() {
    var phoneEl = document.getElementById('cg-phone'), amtEl = document.getElementById('cg-amt');
    var phone = phoneEl ? phoneEl.value.trim() : '';
    var amt = amtEl ? parseFloat(amtEl.value) : NaN;
    wPhone = phone;
    wAmt = amtEl ? amtEl.value : '';
    if (!phone || !amt || amt <= 0) {
        wMsg = 'Ingresa un teléfono y un monto válido.';
        render();
        return;
    }
    // Antes esto transfería con un solo tap y sin mostrar a quién le estaba llegando el
    // dinero — un typo en el teléfono lo mandaba a un desconocido sin ninguna forma de
    // darse cuenta antes de confirmar (hallazgo de la auditoría de flujo de pedidos).
    var name;
    try {
        var lookup = await api('credit-lookup', { token: token, toPhone: phone });
        name = lookup.name;
    }
    catch (e) {
        wMsg = e.message;
        render();
        return;
    }
    if (!(await showConfirm('¿Enviar ' + SOLES_TXT + amt + ' de crédito a ' + name + ' (' + phone + ')?')))
        return;
    try {
        await api('credit-gift', { token: token, toPhone: phone, amount: amt });
        var r = await api('session-check', { token: token });
        if (r.valid) {
            cust = r.customer;
            cacheCust(cust, isAdmin);
        }
        wMsg = '¡Crédito enviado a ' + name + '!';
        wPhone = '';
        wAmt = '';
    }
    catch (e) {
        wMsg = e.message;
    }
    render();
}

async function doWeeklyPlanBuy() {

function payWeeklyPlanWithCulqi(amountSoles, email, ref) {
    if (typeof Culqi === 'undefined') {
        _weeklyPlanBuyInProgress = false;
        wpMsg = 'No se pudo cargar la pasarela de pago. Verifica tu conexión e intenta de nuevo.';
        _pendingWeeklyPlan = null;
        render();
        return;
    }
    if (!CULQI_PUBLIC_KEY || CULQI_PUBLIC_KEY.indexOf('REEMPLAZA') >= 0) {
        _weeklyPlanBuyInProgress = false;
        wpMsg = 'La pasarela de pago aún no está configurada. Contacta al administrador.';
        _pendingWeeklyPlan = null;
        render();
        return;
    }
    Culqi.publicKey = CULQI_PUBLIC_KEY;
    Culqi.settings({
        title: 'SND//WCH',
        currency: 'PEN',
        amount: Math.round(amountSoles * 100),
        description: 'Plan Semanal ' + ref
    });
    Culqi.options({
        lang: 'auto',
        installments: false,
        paymentMethods: { tarjeta: true, yape: true, billetera: false, bancaMovil: false, agente: false, cuotealo: false }
    });
    Culqi.open();
}
async function chargeAndFinalizeWeeklyPlan(culqiToken) {
    if (!_pendingWeeklyPlan)
        return;
    var pw = _pendingWeeklyPlan;
    busy = true;
    busyMsg = 'Procesando pago...';
    render();
    try {
        var resp = await fetch(CREDIT_CHARGE_FN_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: culqiToken, amountSoles: pw.amount, email: pw.email, ref: pw.ref })
        });
        var data = await resp.json().catch(function () { return {}; });
        if (!resp.ok || !data.success) {
            busy = false;
            _weeklyPlanBuyInProgress = false;
            wpMsg = data.error || 'El pago fue rechazado. Intenta de nuevo o con otro método.';
            _pendingWeeklyPlan = null;
            render();
            return;
        }
        try {
            await api('confirm-weekly-plan', { token: token, chargeId: data.chargeId, ref: pw.ref });
        }
        catch (e) {
            busy = false;
            _weeklyPlanBuyInProgress = false;
            wpCritical = true;
            wpMsg = (e.message || 'No se pudo confirmar tu Plan Semanal.') + ' Ya se realizó el cobro — contáctanos con tu referencia ' + pw.ref + ' para confirmar el saldo manualmente. No vuelvas a intentar pagar.';
            _pendingWeeklyPlan = null;
            render();
            return;
        }
        var r = await api('session-check', { token: token });
        if (r.valid) {
            cust = r.customer;
            cacheCust(cust, isAdmin);
        }
        busy = false;
        _weeklyPlanBuyInProgress = false;
        wpEmail = '';
        _pendingWeeklyPlan = null;
        showToast('¡Listo! Recibiste ' + SOLES + pw.creditAmount + ' en saldo.');
        sc = 'p_profile';
        render();
    }
    catch (e) {
        // Mismo riesgo que el catch de arriba (confirm-weekly-plan falló): no sabemos si el
        // cargo llegó a ejecutarse antes de que se cortara la conexión.
        busy = false;
        _weeklyPlanBuyInProgress = false;
        wpCritical = true;
        wpMsg = 'No pudimos confirmar si el pago se procesó (falló la conexión). Antes de reintentar, contáctanos con tu referencia ' + pw.ref + ' para verificar si ya se hizo el cobro.';
        _pendingWeeklyPlan = null;
        render();
    }
}

// no viven en adminOrders.

// usaba customer_phone (el de la cuenta), así que un pedido de invitado nunca mostraba
// este botón, dejando al operador sin forma de escribirle por WhatsApp.
// Traduce el enum de status a una frase real — antes se inyectaba el enum crudo
// (ej. "está: PREPARANDO") directo en el mensaje de WhatsApp que lee el cliente.
function waStatusPhrase(o) {
    switch (o.status) {
        case 'RECIBIDO': return 'fue recibido y lo vamos a preparar pronto';
        case 'PREPARANDO': return 'lo estamos preparando ahora mismo';
        case 'EN CAMINO': return 'va en camino a tu dirección' + (o.eta_minutes ? ' (ETA ~' + o.eta_minutes + ' min)' : '');
        case 'ENTREGADO': return 'fue entregado — ¡que lo disfrutes!';
        case 'CANCELADO': return 'fue cancelado';
        default: return 'está: ' + o.status;
    }
}

// Confirma el pago Yape/Plin de todos los pedidos seleccionados que lo tengan pendiente
// de un solo tap — antes había que confirmar uno por uno (ver confirmOrderPayment),
// friccioso durante una tanda de varios pedidos simultáneos en hora pico (hallazgo de la
// auditoría del panel admin).
async function bulkConfirmPayments() {
    var ids = Object.keys(bulkSelected).filter(function (k) { return bulkSelected[k]; });
    var targets = ids.filter(function (id) {
        var o = (adminOrders || []).find(function (x) { return x.id === id; });
        return o && (o.payment_method === 'yape' || o.payment_method === 'plin') && o.payment_status !== 'paid';
    });
    if (!targets.length) {
        showToast('Ningún pedido seleccionado tiene un pago pendiente de confirmar.');
        return;
    }
    if (!(await showConfirm('¿Confirmar el pago de ' + targets.length + ' pedido(s)?')))
        return;
    busy = true;
    busyMsg = 'Confirmando pagos...';
    render();
    var okCount = 0, failCount = 0;
    for (var i = 0; i < targets.length; i++) {
        try {
            var r = await api('admin-confirm-payment', { token: token, orderId: targets[i] });
            adminOrders = adminOrders.map(function (o) { return o.id === targets[i] ? r.order : o; });
            okCount++;
        }
        catch (e) {
            failCount++;
        }
    }
    bulkSelected = {};
    busy = false;
    if (failCount)
        showToast(okCount + ' confirmado(s), ' + failCount + ' fallaron.');
    render();
}

async function bulkAdvanceStatus(status) {

        return;

        var updatedIds = {};
        (r.updated || []).forEach(function (o) { updatedIds[o.id] = o; });
        adminOrders = adminOrders.map(function (o) { return updatedIds[o.id] ? updatedIds[o.id] : o; });

function toCsv(rows) {
    if (!rows || !rows.length)
        return '';
    var cols = Object.keys(rows[0]);
    function csvEsc(v) { if (v == null)
        return ''; var s = String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
    var lines = [cols.join(',')];
    rows.forEach(function (r) { lines.push(cols.map(function (c) { return csvEsc(r[c]); }).join(',')); });
    return lines.join('\n');
}
async function exportCsv(action, filename) {
    busy = true;
    busyMsg = 'Generando CSV...';
    render();
    try {
        var r = await api(action, { token: token });
        var rows = r.orders || r.customers || [];
        var csv = toCsv(rows);
        if (!csv) {
            busy = false;
            render();
            showToast('No hay datos para exportar.', 'info');
            return;
        }
        var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'sndwch-' + filename + '-' + today().replace(/\//g, '-') + '.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
        if (r.truncated)
            showToast('El negocio ya tiene más de ' + rows.length + ' registros — este CSV solo incluye los más recientes, no todo el historial.', 'info');
    }
    catch (e) {
        showToast('Error al exportar: ' + e.message);
    }
    busy = false;
    render();
}

function setGpsHint(msg, color) { var h = document.getElementById('gps-hint'); if (h)

function doGPS() {
    var btn = document.getElementById('gps-btn');
    function done() { if (btn) {
        btn.innerHTML = '&#128205;';
        btn.disabled = false;
    } }
    function fail(err) {
        done();
        var msg = 'No pudimos obtener tu ubicación exacta. Arrastra el mapa hasta tu dirección.';
        if (err && err.code === 1)
            msg = 'Bloqueaste el permiso de ubicación, o estás dentro de una app como WhatsApp que no deja usar el GPS. Toca los tres puntos → "Abrir en el navegador", o arrastra el mapa manualmente.';
        else if (err && err.code === 2)
            msg = 'Tu dispositivo no pudo determinar tu ubicación. Arrastra el mapa hasta tu dirección.';
        else if (err && err.code === 3)
            msg = 'La búsqueda de ubicación tardó demasiado. Arrastra el mapa hasta tu dirección.';
        setGpsHint(msg);
        openMap(-8.1120, -79.0290, true);
    }
    if (!navigator.geolocation) {
        fail();

    }
    if (btn) {
        btn.innerHTML = '<span class="sp">&#8635;</span>';
        btn.disabled = true;

    setGpsHint('Buscando tu ubicación...', '#A8C8B0');

function catalogFormValues(category, code) {

async function saveCatalogPrice(category, code) {

// Guardado en lote — antes cada fila (22+ entre proteínas/signatures/bebidas/
// recompensas) solo se podía guardar una por una, sin indicador de qué quedó sin
// guardar (hallazgo de auditoría admin). Reutiliza el mismo action de a una fila
// (admin-catalog-set-price) por cada cambio real detectado, sin tocar el backend —
// lee TODOS los inputs antes de mostrar el estado "busy" (que reemplaza el DOM y
// borraría esos mismos inputs si se leyeran después).
async function saveAllCatalogChanges() {
    var jobs = [];
    PROTS.forEach(function (p) {
        var v = catalogFormValues('protein', p.id);
        if (v.p15 !== p.p15 || v.p30 !== p.p30 || v.pDbl !== p.pDbl)
            jobs.push({ category: 'protein', code: p.id, values: v });
    });
    SIGS.forEach(function (s) {
        var v = catalogFormValues('sig', s.id);
        if (v.p15 !== s.p15 || v.p30 !== s.p30)
            jobs.push({ category: 'sig', code: s.id, values: v });
    });
    SIDES.forEach(function (d) {
        var v = catalogFormValues('side', d.id);
        if (v.price !== d.p)
            jobs.push({ category: 'side', code: d.id, values: v });
    });
    RWDS.forEach(function (rw) {
        var v = catalogFormValues('reward', rw.id);
        if (v.pts !== rw.pts)
            jobs.push({ category: 'reward', code: rw.id, values: v });
    });
    if (!jobs.length) {
        catalogMsg = 'No hay cambios sin guardar.';
        render();
        setTimeout(function () { catalogMsg = ''; if (sc === 'admin_catalog')
            render(); }, 2000);
        return;
    }
    busy = true;
    busyMsg = 'Guardando ' + jobs.length + ' cambio(s)...';
    render();
    try {
        for (var i = 0; i < jobs.length; i++) {
            await api('admin-catalog-set-price', { token: token, code: jobs[i].code, category: jobs[i].category, values: jobs[i].values });
        }
        await loadCatalogBackground();
        catalogMsg = jobs.length + ' precio(s) actualizado(s).';
    }
    catch (e) {
        busy = false;
        render();
        showToast('Error: ' + e.message);
        return;
    }
    busy = false;
    render();
    setTimeout(function () { catalogMsg = ''; if (sc === 'admin_catalog')
        render(); }, 2500);
}

function haversineKm(lat1, lon1, lat2, lon2) {
    var R = 6371;
    var dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
// Chequeo de ubicación de una sola vez al abrir la app (no un rastreo continuo): si el
// cliente ya cerró el banner hoy, o niega/no tiene geolocalización, simplemente no se
// muestra nada — nunca insiste ni vuelve a pedir permiso en la misma sesión.
function checkNearbyStore() {
    if (_nearCheckDone)
        return;
    _nearCheckDone = true;
    var today = new Date().toISOString().slice(0, 10);
    if (localStorage.getItem('sw_near_dismissed') === today)
        return;
    if (!('geolocation' in navigator))
        return;
    navigator.geolocation.getCurrentPosition(function (pos) {
        var d = haversineKm(pos.coords.latitude, pos.coords.longitude, STORE_LAT, STORE_LON);
        if (d <= NEARBY_RADIUS_KM) {
            nearStore = true;
            render();
        }
    }, function () { }, { maximumAge: 600000, timeout: 8000 });
}
function dismissNearbyBanner() {

// NOTIFICACIONES PUSH — avisan cuando el pedido pasa a PREPARANDO/EN CAMINO/ENTREGADO,
// incluso con la app cerrada. Solo disponibles para clientes con cuenta (la suscripción
// se guarda ligada a tu teléfono) y requieren HTTPS (o localhost) + un navegador
// compatible con Push API.
function urlBase64ToUint8Array(base64String) {
    var padding = '='.repeat((4 - base64String.length % 4) % 4);
    var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    var rawData = atob(base64);
    var out = new Uint8Array(rawData.length);
    for (var i = 0; i < rawData.length; i++)
        out[i] = rawData.charCodeAt(i);
    return out;
}
async function checkPushSubscription() {
    if (!('serviceWorker' in navigator) || !('PushManager' in window))
        return;
    try {
        var reg = await navigator.serviceWorker.ready;
        var sub = await reg.pushManager.getSubscription();
        pushSubscribed = !!sub;
        render();
    }
    catch (e) { }
}
async function togglePushNotifications() {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        pushMsg = 'Tu navegador no soporta notificaciones push.';
        render();
        return;
    }
    if (!cust) {
        pushMsg = 'Inicia sesión para activar notificaciones.';
        render();
        return;
    }
    try {
        var reg = await navigator.serviceWorker.ready;
        var existing = await reg.pushManager.getSubscription();
        if (existing) {
            await api('push-unsubscribe', { token: token, endpoint: existing.endpoint });
            await existing.unsubscribe();
            pushSubscribed = false;
            pushMsg = 'Notificaciones desactivadas.';
            render();
            return;
        }
        var perm = await Notification.requestPermission();
        if (perm !== 'granted') {
            pushMsg = 'Necesitas permitir notificaciones desde tu navegador.';
            render();
            return;
        }
        var sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
        var subJson = sub.toJSON();
        await api('push-subscribe', { token: token, endpoint: subJson.endpoint, p256dh: subJson.keys.p256dh, auth: subJson.keys.auth });
        pushSubscribed = true;
        pushMsg = '¡Notificaciones activadas!';
        render();
    }
    catch (e) {
        pushMsg = 'No se pudo activar: ' + (e.message || 'intenta de nuevo.');
        render();
    }
}
// INIT
// Antes esperábamos la respuesta de session-check ANTES del primer pintado siempre que
// hubiera un token guardado — un solo round-trip al backend (que puede tardar 1-3s por
// cold start de la Edge Function + la vuelta Perú↔servidor) bloqueaba la pantalla de
// carga en CADA recarga, incluso para alguien que ya estaba con sesión iniciada. Ahora,
// si hay una copia cacheada del cliente (ver cacheCust), se pinta con ella de inmediato
// — session-check sigue corriendo en segundo plano para confirmar/corregir en silencio.
// Solo se bloquea con el spinner cuando no hay nada que mostrar todavía (primer login en
// este dispositivo tras limpiar datos, por ejemplo).
(async function () {
    var haveCachedCust = false;
    if (token) {
        try {
            var cachedRaw = localStorage.getItem('sw_cust_cache');
            if (cachedRaw) {
                cust = JSON.parse(cachedRaw);
                isAdmin = localStorage.getItem('sw_is_admin_cache') === '1';
                haveCachedCust = true;
            }
        }
        catch (e) { }
    }
    restoreCart();
    render();
    if (token) {
        if (!haveCachedCust) {
            busy = true;
            busyMsg = 'Verificando tu sesión...';
            render();
        }
        try {
            var r = await api('session-check', { token: token });
            if (r.valid) {
                cust = r.customer;
                isAdmin = r.isAdmin;
                cacheCust(cust, isAdmin);
            }
            else {
                token = '';
                localStorage.removeItem('sw_tok');
                cust = null;
                isAdmin = false;
                cacheCust(null);
            }
        }
        catch (e) { } // sin conexión — sigue con lo ya pintado (cache o invitado), no se pierde la sesión guardada
        if (!haveCachedCust)
            busy = false;
        render();
    }
    loadInvBackground().then(function () { render(); }); // load stock status in background, re-render when ready
    loadCatalogBackground().then(function () { render(); }); // load current prices in background, re-render when ready
    loadStoreHoursBackground().then(function () { render(); }); // load real store hours in background, re-render when ready
    if (cust)
        loadUserExtras();
    checkPushSubscription();
    checkNearbyStore();
    // ?group=CODE (link compartido de un pedido grupal) — no exige cuenta para entrar y
    // contribuir, solo para organizar/cerrar, así que se abre para cualquiera.
    if (groupCodeFromUrl) {
        groupCode = groupCodeFromUrl;
        sc = 'group_order';
        render();
        loadGroupOrder();
        startGroupPoll();
    }
