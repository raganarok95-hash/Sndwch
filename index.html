// SOUND
function playNotif(){
  try{
    var ctx=new(window.AudioContext||window.webkitAudioContext)();
    [[523,0],[659,.15],[784,.30]].forEach(function(n){
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=n[0];o.type='sine';
      g.gain.setValueAtTime(0,ctx.currentTime+n[1]);
      g.gain.linearRampToValueAtTime(.25,ctx.currentTime+n[1]+.06);
      g.gain.linearRampToValueAtTime(0,ctx.currentTime+n[1]+.38);
      o.start(ctx.currentTime+n[1]);
      o.stop(ctx.currentTime+n[1]+.42);
    });
  }catch(e){}
}

      var total=r.orders.length;

      lastPollCount=total;

var _pendingOrder=null;
function doOrder(){
  var nom=document.getElementById('o-nom').value.trim();
  var email=document.getElementById('o-email').value.trim();
  var addr=document.getElementById('o-addr').value.trim();
  var notes=document.getElementById('o-notes').value.trim();
  var errEl=document.getElementById('o-err');
  if(!nom||!addr){if(errEl)errEl.textContent='Ingresa tu nombre y dirección.';return;}
  if(!email||!/^[^@]+@[^@]+\.[^@]+$/.test(email)){if(errEl)errEl.textContent='Ingresa un correo válido para tu comprobante de pago.';return;}
  if(errEl)errEl.textContent='';
  var sig=SIGS.find(function(x){return x.id===sigId;}),pr=PROTS.find(function(x){return x.id===prot;}),t=total(),ref=oref();
  var dbl=dblProtRef();
  var sumParts=[szLabel(size)];
  if(mode==='sig'&&sig){sumParts.push(sig.n+' S/'+sigPrice(sig));}
  else{sumParts.push(fn(PROTS,prot)+' S/'+protPrice(pr));}
  if(doubleProt)sumParts.push('+DOBLE PROTEÍNA');if(extraSauce)sumParts.push('+SALSA EXTRA');
  var summary=sumParts.join(' · ');
  var lines=['*PEDIDO SND//WCH*','Ref: '+ref,'','👤 '+nom,'📍 '+addr,'','Tamaño: '+szLabel(size)];
  if(mode==='sig'&&sig){lines.push('★ '+sig.n+' — S/'+sigPrice(sig));lines.push('Pan: '+fn(BASES,sig.base));lines.push('Proteína: '+fn(PROTS,sig.prot));lines.push('Toppings: '+sig.tops.map(function(id){return fn(TOPS,id);}).join(', '));lines.push('Salsas: '+sig.sauces.map(function(id){return fn(SAUCES,id);}).join(' + '));}
  else{lines.push('Pan: '+fn(BASES,base));lines.push('Proteína: '+fn(PROTS,prot)+' S/'+protPrice(pr));lines.push('Toppings: '+(tops.length?tops.map(function(id){return fn(TOPS,id);}).join(', '):'ninguno'));lines.push('Queso: '+(cheese?fn(CHEESE,cheese):'sin queso'));lines.push('Salsas: '+(sauces.length?sauces.map(function(id){return fn(SAUCES,id);}).join(' + '):'ninguna'));}
  if(doubleProt&&dbl)lines.push('+ DOBLE '+dbl.l+' // '+dbl.s+' S/'+dbl.pDbl);
  if(extraSauce)lines.push('+ SALSA EXTRA S/2');
  if(notes)lines.push('📝 '+notes);
  lines.push('','*TOTAL: S/'+t+'*');
  if(cust)lines.push('Cliente: '+cust.name+' ('+cust.phone+')');
  var productKey=mode==='sig'?sigId:prot;
  var ingredients=(mode==='sig'&&sig)?[sig.base,sig.prot].concat(sig.tops).concat(sig.sauces):[base,prot].concat(tops).concat(cheese?[cheese]:[]).concat(sauces);
  if(doubleProt){var dProtCode=(mode==='sig'&&sig)?sig.prot:prot;ingredients.push(dProtCode);}
  _pendingOrder={ref:ref,nom:nom,addr:addr,email:email,notes:notes,summary:summary,total:t,waLines:lines,mode:mode,productKey:productKey,ingredients:ingredients,sigId:sigId,base:base,prot:prot,tops:tops,cheese:cheese,sauces:sauces,size:size,doubleProt:doubleProt,extraSauce:extraSauce};
  payWithCulqi(t,email);
}

function payWithCulqi(amountSoles,email){
  if(typeof Culqi==='undefined'){alert('No se pudo cargar la pasarela de pago. Verifica tu conexión e intenta de nuevo.');return;}
  if(!CULQI_PUBLIC_KEY||CULQI_PUBLIC_KEY.indexOf('REEMPLAZA')>=0){alert('La pasarela de pago aún no está configurada. Contacta al administrador.');return;}
  Culqi.publicKey=CULQI_PUBLIC_KEY;
  Culqi.settings({
    title:'SND//WCH',
    currency:'PEN',
    amount:Math.round(amountSoles*100),
    description:'Pedido '+(_pendingOrder?_pendingOrder.ref:'')
  });
  Culqi.options({

async function chargeAndFinalize(culqiToken,culqiOrderId){
  if(!_pendingOrder)return;
  var po=_pendingOrder;
  busy=true;busyMsg='Procesando pago...';render();
  try{
    var resp=await fetch(CHARGE_FN_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:culqiToken,amountSoles:po.total,email:po.email,orderRef:po.ref})
    });
    var data=await resp.json().catch(function(){return{};});
    if(!resp.ok||!data.success){
      busy=false;render();
      var errEl=document.getElementById('o-err');
      var msg=data.error||'El pago fue rechazado. Intenta con otra tarjeta.';
      if(errEl)errEl.textContent=msg;else alert(msg);
      return;
    }
    // Pago confirmado con Culqi — el servidor re-verifica el cargo antes de crear
    // el pedido y acreditar puntos (nunca confía en datos enviados por el cliente).
    var res;
    try{
      res=await api('place-order',{token:token,chargeId:data.chargeId,ref:po.ref,name:po.nom,email:po.email,address:po.addr,notes:po.notes,summary:po.summary,total:po.total,mode:po.mode,productKey:po.productKey,ingredients:po.ingredients,sigId:po.sigId,base:po.base,prot:po.prot,tops:po.tops,cheese:po.cheese,sauces:po.sauces,size:po.size,doubleProt:po.doubleProt,extraSauce:po.extraSauce});
    }catch(e){

      var errEl3=document.getElementById('o-err');

      if(errEl3)errEl3.textContent=msg3;else alert(msg3);
      return;
    }
    if(res.customer)cust=res.customer;
    window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(po.waLines.join('\n')),'_blank');
    localStorage.setItem('sw_last_ref',po.ref);
    window._lTot=po.total;window._lRef=po.ref;window._lChargeId=data.chargeId;
    mode=null;sigId=null;base=null;prot=null;cheese=null;tops=[];sauces=[];size=null;doubleProt=false;extraSauce=false;
    _pendingOrder=null;
    busy=false;sc='o_sent';render();
  }catch(e){
    busy=false;render();
    var errEl2=document.getElementById('o-err');
    if(errEl2)errEl2.textContent='Error de conexión al procesar el pago. Intenta de nuevo.';
  }
}

async function doReg(){
  var name=document.getElementById('r-name').value.trim(),
      phone=document.getElementById('r-phone').value.trim(),
      pin=document.getElementById('r-pin').value.trim(),
      email=document.getElementById('r-email').value.trim(),
      dni=document.getElementById('r-dni').value.trim(),
      bdayRaw=document.getElementById('r-bday').value.trim();
  var err=document.getElementById('auth-err');
  if(!name||!phone||pin.length<4){if(err)err.textContent='Completa nombre, teléfono y PIN (mínimo 4 dígitos).';return;}
  if(!dni||!/^\d{8}$/.test(dni)){if(err)err.textContent='DNI es obligatorio y debe tener 8 dígitos.';return;}
  if(email&&!/^[^@]+@[^@]+\.[^@]+$/.test(email)){if(err)err.textContent='Correo inválido.';return;}
  var bday=null;
  if(bdayRaw){
    var m=bdayRaw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if(!m){if(err)err.textContent='Fecha de nacimiento debe ser DD/MM/AAAA.';return;}
    bday=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');

  busy=true;busyMsg='Creando cuenta...';render();
  try{
    var r=await api('register',{name:name,phone:phone,pin:pin,email:email||null,dni:dni,bday:bday});
    cust=r.customer;isAdmin=r.isAdmin;token=r.token;

  localStorage.setItem('sw_ph',phone);localStorage.setItem('sw_tok',token);savedPh=phone;busy=false;sc='p_welcome';render();setTimeout(function(){sc='p_home';render();},3200);

async function updateStatus(ordId,newSt){
  var ord=(adminOrders||[]).find(function(o){return o.id===ordId;});
  var eta=null;
  if(newSt==='EN CAMINO'){
    var etaStr=prompt('¿Tiempo estimado de entrega en minutos?','20');
    if(etaStr===null)return; // admin canceló
    eta=parseInt(etaStr,10);
    if(!eta||eta<=0)eta=20;
  }
  try{
    var r=await api('admin-update-status',{token:token,orderId:ordId,status:newSt,etaMinutes:eta});
    adminOrders=adminOrders.map(function(o){return o.id===ordId?r.order:o;});
    if(newSt==='ENTREGADO')adminOrders=adminOrders.filter(function(o){return o.id!==ordId;});
    render();
  }catch(e){console.warn(e);return;}
  if(ord&&ord.customer_email){
    notifyOrderEmail(ord.customer_email,ord.customer_name,ord.ref,newSt,eta);
  }
}
async function notifyOrderEmail(to,name,ref,status,eta){
  try{
    var resp=await fetch(EMAIL_FN_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({to:to,customerName:name,orderRef:ref,status:status,etaMinutes:eta})
    });
    var data=await resp.json().catch(function(){return{};});
    if(!resp.ok||!data.success){console.warn('Email no enviado:',data.error||data);}
  }catch(e){console.warn('Error enviando correo:',e);}
}

function toCsv(rows){
  if(!rows||!rows.length)return'';
  var cols=Object.keys(rows[0]);
  function esc(v){if(v==null)return'';var s=String(v);return/[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
  var lines=[cols.join(',')];
  rows.forEach(function(r){lines.push(cols.map(function(c){return esc(r[c]);}).join(','));});
  return lines.join('\n');
}
async function exportCsv(action,filename){
  busy=true;busyMsg='Generando CSV...';render();
  try{
    var r=await api(action,{token:token});
    var rows=r.orders||r.customers||[];
    var csv=toCsv(rows);
    if(!csv){busy=false;render();alert('No hay datos para exportar.');return;}
    var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download='sndwch-'+filename+'-'+today().replace(/\//g,'-')+'.csv';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},2000);
  }catch(e){alert('Error al exportar: '+e.message);}
  busy=false;render();
}

function setGpsHint(msg,color){var h=document.getElementById('gps-hint');if(h)h.innerHTML='<span style="color:'+(color||'#ffa500')+'">'+msg+'</span>';}
function doGPS(){
  var btn=document.getElementById('gps-btn');
  function done(){if(btn){btn.innerHTML='&#128205;';btn.disabled=false;}}
  function fail(err){
    done();
    var msg='No pudimos obtener tu ubicación exacta. Arrastra el mapa hasta tu dirección.';
    if(err&&err.code===1)msg='Bloqueaste el permiso de ubicación, o estás dentro de una app como WhatsApp que no deja usar el GPS. Toca los tres puntos → "Abrir en el navegador", o arrastra el mapa manualmente.';
    else if(err&&err.code===2)msg='Tu dispositivo no pudo determinar tu ubicación. Arrastra el mapa hasta tu dirección.';
    else if(err&&err.code===3)msg='La búsqueda de ubicación tardó demasiado. Arrastra el mapa hasta tu dirección.';
    setGpsHint(msg);
    openMap(-8.1120,-79.0290,true);
  }
  if(!navigator.geolocation){fail();return;}
  if(btn){btn.innerHTML='<span class="sp">&#8635;</span>';btn.disabled=true;}
  setGpsHint('Buscando tu ubicación...','#8BAF9A');
  navigator.geolocation.getCurrentPosition(
    function(pos){done();setGpsHint('','#8BAF9A');openMap(pos.coords.latitude,pos.coords.longitude,false);},
    function(err){
      // Un GPS "frío" (primer intento) puede tardar más de lo que da un timeout agresivo.
      // Antes de rendirnos, reintentamos una vez con precisión más baja (mucho más rápida).
      if(err&&err.code===3){
        navigator.geolocation.getCurrentPosition(
          function(pos){done();setGpsHint('','#8BAF9A');openMap(pos.coords.latitude,pos.coords.longitude,false);},
          function(err2){fail(err2);},
          {timeout:8000,enableHighAccuracy:false,maximumAge:120000}
        );
        return;
      }
      fail(err);
    },
    {timeout:15000,enableHighAccuracy:true,maximumAge:60000}
  );
}
var _lmap=null,_mTimer=null;
function loadLeaflet(cb){
  if(window.L){cb();return;}
  // Load CSS
  var lnk=document.createElement('link');
  lnk.rel='stylesheet';
  lnk.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
  document.head.appendChild(lnk);
  // Load JS
  var s=document.createElement('script');
  s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
  s.onload=cb;
  s.onerror=function(){alert('No se pudo cargar el mapa. Verifica tu conexión.');};
  document.head.appendChild(s);
}
function openMap(lat,lon,approx){
  var m=document.getElementById('mmap');
  if(!m)return;
  m.style.display='flex';
  var banner=document.getElementById('mmap-accuracy-banner');
  if(banner)banner.style.display=approx?'block':'none';
  loadLeaflet(function(){
    setTimeout(function(){
      if(!_lmap){
      _lmap=L.map('lmap',{zoomControl:true,attributionControl:false});
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(_lmap);
      _lmap.on('move',function(){var e=document.getElementById('maddr');if(e)e.textContent='Buscando...';if(_mTimer)clearTimeout(_mTimer);});
      _lmap.on('moveend',function(){var c=_lmap.getCenter();if(_mTimer)clearTimeout(_mTimer);_mTimer=setTimeout(function(){revGeo(c.lat,c.lng);},700);});
    }
    _lmap.setView([lat,lon],17);
    _lmap.invalidateSize();
    revGeo(lat,lon);
    },150);
  }); // end loadLeaflet
}
function revGeo(lat,lon){
  window._mLat=lat;window._mLon=lon;
  // Nominatim for approximate reference only
  var url='https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat='+lat+'&lon='+lon+'&accept-language=es&zoom=18';
  fetch(url)
    .then(function(r){return r.json();})
    .then(function(d){
      var a=d.address||{};
      var parts=[];
      var road=a.road||a.pedestrian||a.residential||a.suburb||'';
      var nb=a.neighbourhood||a.quarter||a.city_district||'';
      if(road)parts.push(road);
      if(nb&&nb!==road)parts.push(nb);
      var hint=parts.length?parts.join(', '):'';
      window._mHint=hint;
      var h=document.getElementById('maddr-hint');
      if(h)h.innerHTML=hint?'<span style="color:#CBA258">&#8599; Referencia: </span>'+hint:'';
      // Pre-fill input if empty
      var inp=document.getElementById('maddr-input');
      if(inp&&!inp.value&&hint)inp.value=hint;
    })
    .catch(function(){
      window._mHint='';
    });
}

function closeMap(){document.getElementById('mmap').style.display='none';}
function confirmMap(){
  var inp=document.getElementById('maddr-input');
  var a=inp?inp.value.trim():'';
  if(!a){
    if(inp)inp.style.borderColor='#ff5555';
    setTimeout(function(){if(inp)inp.style.borderColor='#2a2a2a';},1500);
    return;
  }
  if(_lmap){var c=_lmap.getCenter();window._mLat=c.lat;window._mLon=c.lng;}
  closeMap();
  var el=document.getElementById('o-addr');
  if(el){el.value=a;el.style.borderColor='#3A86FF';el.focus();}
  var h=document.getElementById('gps-hint');
  if(h)h.innerHTML='<a href="https://maps.google.com/?q='+window._mLat+','+window._mLon+'" target="_blank" style="color:#CBA258;font-size:11px;text-decoration:none">&#128205; Ver pin en Google Maps</a>';
  setTimeout(function(){var e=document.getElementById('o-addr');if(e)e.style.borderColor='#0d0d0d';},3000);
}

    ?'¿Confirmas que "'+name+'" vuelve a estar DISPONIBLE?'
    :'¿Confirmas marcar "'+name+'" como SIN STOCK? No se podrá elegir en pedidos hasta que lo reactives.';
  if(!confirm(msg))return;
  busy=true;busyMsg='Actualizando...';render();
  try{
    await api('admin-inventory-toggle',{token:token,code:code,name:name,inStock:goingTo});
    invStock[code]=goingTo;
  }catch(e){alert('Error al actualizar: '+e.message);}
  busy=false;render();
}
async function setStock(code,name){
  var el=document.getElementById('qty-'+code);
  var raw=el?el.value.trim():'';
  var qty=raw===''?null:parseInt(raw,10);
  busy=true;busyMsg='Guardando stock...';render();
  try{
    await api('admin-inventory-set-stock',{token:token,code:code,name:name,qty:qty});
    invQty[code]=qty;
    if(qty!=null)invStock[code]=qty>0;
  }catch(e){alert('Error al actualizar: '+e.message);}
  busy=false;render();
}

async function addAdmin(){
  var ph=document.getElementById('aa-ph')&&document.getElementById('aa-ph').value.trim();

  if(!ph||!nm){alert('Ingresa nombre y teléfono.');return;}

    +'</div>'
    +'<div id="rec-msg" style="font-family:Barlow,sans-serif;font-size:12px;color:#ff5555;min-height:16px;margin-bottom:12px;text-align:center"></div>'

    +'</div>';

async function doRecover(){
  var phone=document.getElementById('rec-phone').value.trim();
  var dni=document.getElementById('rec-dni').value.trim();
  var bdayRaw=document.getElementById('rec-bday').value.trim();
  var msg=document.getElementById('rec-msg');
  if(!phone||!dni||!bdayRaw){if(msg)msg.textContent='Completa teléfono, DNI y fecha de nacimiento.';return;}
  var m=bdayRaw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m){if(msg)msg.textContent='Fecha debe ser DD/MM/AAAA.';return;}
  var bday=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  busy=true;busyMsg='Verificando...';render();
  try{
    var r=await api('recover',{phone:phone,dni:dni,bday:bday});
    recNewPin=r.newPin;
    busy=false;sc='p_recover';render();
  }catch(e){
    busy=false;sc='p_recover';render();
    var m2=document.getElementById('rec-msg');
    if(m2)m2.textContent=e.message;
  }
}
