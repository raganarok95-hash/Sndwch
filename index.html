<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- maximum-scale=1 y user-scalable=no quitados: bloquear el zoom incumple WCAG 1.4.4
     (redimensionar texto) y la app usa tipografías chicas en decenas de sitios. Además
     iOS lo ignora desde iOS 10, así que solo servía para dejar la página descuadrada
     tras el zoom automático al enfocar un input, sin forma de volver.
     viewport-fit=cover habilita env(safe-area-inset-*) para el notch/indicador. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SND//WCH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=Fraunces:opsz,wght@9..144,400..700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E3932">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SND//WCH">
<!-- defer: Culqi solo se usa dentro de payWithCulqi(), disparado por un clic del usuario
     en el checkout — nunca en el primer render, así que no hace falta bloquear el
     parseo/pintado inicial de la página esperando este script de terceros. -->
<script src="https://checkout.culqi.com/js/v4" defer></script>
<!-- async+defer: Google Identity Services solo se usa dentro de sPAuth() cuando
     googleConfigured() es true — nunca bloquea el primer render, igual que Culqi arriba. -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
/* ── PALETA DEL CLIENTE — LOS TOKENS DE VERDAD (2026-09-09) ────────────────────
   Hasta hoy los colores del cliente NO eran variables: eran el FALLBACK de cada
   `var(--sw-card,#2D5246)`, repetido en 997 sitios de src/app/. Nadie definía esas
   properties en ningún lado, así que cambiar la paleta significaba 997 ediciones y la
   garantía de que alguna se quedaba atrás — el mismo defecto de fondo que ya costó tres
   semanas de precios fantasma, pero en color.
   Definirlas acá hace que TODOS esos call sites resuelvan al token y el fallback deje de
   usarse. No hay que tocar ni uno: el fallback se queda como está, inerte.
   Los valores salen del logo nuevo, muestreados píxel a píxel del archivo del dueño, no
   estimados a ojo. Son muy cercanos a los que ya había, así que el cambio no rompe
   ninguna pantalla; lo que gana el proyecto es poder mover la paleta desde un solo sitio. */
:root{
  /* Verde bosque: el lado de SANDO. Es el contorno y la mitad izquierda del mono. */
  --sw-bg:#1E3932;
  --sw-card:#2D5246;
  --sw-card2:#1A3028;
  --sw-card-danger:#1A2420;
  --sw-border:#3A6B58;
  --sw-border-soft:#1c1c1c;
  --sw-text:#FFFFFF;
  --sw-text-body:#F2F0EB;
  --sw-text-muted:#A8C8B0;
  --sw-text-muted2:#8BAF9A;
  --sw-text-muted3:#7FA08D;
  --sw-text-muted4:#C8D6CE;

  /* ── COLORES DE ESTADO (2026-09-10) ──
     Antes eran ~230 literales sueltos repartidos por src/app/. El de error estaba escrito
     79 veces; el de confirmación, 60. Subir el contraste de uno para cumplir WCAG
     significaba acertarle a 79 sitios y que alguno se quedara atrás.
     Dos cosas que la tokenización sacó a la luz y que no eran evidentes:
       · El verde de confirmación era `#25D366`, que es EL VERDE DE WHATSAPP. En la misma
         app hay botones reales de WhatsApp, así que un mismo color decía dos cosas
         distintas. Se separan: `--sw-ok` para confirmar, `--sw-whatsapp` para WhatsApp.
       · El texto sobre dorado estaba escrito de DOS formas — `#0d0d0d` (21 veces) y
         `#241a08` (20) — para el mismo trabajo. Se unifican en el cálido, que es el que
         se ve bien sobre el dorado; el casi-negro se veía duro. */
  --sw-ok:#25D366;
  --sw-warn:#ffa500;
  --sw-warn-soft:#ffb366;
  --sw-danger:#ff8888;
  --sw-danger-strong:#ff5555;
  --sw-on-gold:#241a08;
  /* El verde de WhatsApp, SOLO para lo que es WhatsApp de verdad. Coincide con --sw-ok por
     ahora; están separados para que mover uno no mueva el otro. */
  --sw-whatsapp:#25D366;

  /* ── LOS TRES COLORES DE MARCA, sacados del logo ──
     El mono está partido: verde a la izquierda, celeste a la derecha, y su ojo en espiral
     es morado. Esa división no es decorativa — es la estructura del menú. El verde marca
     lo que YA está decidido (los Signatures, la receta cerrada); el celeste marca donde
     ELIGES tú (ARMA EL TUYO, bebidas, recompensas, favoritos). Si algún día una pantalla
     no cae claramente de un lado, es señal de que no sabemos qué le estamos pidiendo al
     cliente en ella. */
  --sw-sky:#8CC8EC;        /* WICHO — el lado de las decisiones */
  --sw-sky-deep:#3F86B4;
  --sw-sky-ink:#0E1A17;    /* texto sobre celeste: nunca blanco, no contrasta */
  /* El morado del ojo espiral. Tiene UN trabajo: lo que sorprende — carga, menú secreto,
     desbloqueos. En cuanto se use de adorno deja de significar algo. */
  --sw-spiral:#C3A6D2;
  --sw-spiral-deep:#4A3D62;
}

/* ── EL LADO ELEGIDO TIÑE TODA LA APP (2026-09-10) ────────────────────────────
   Pedido del dueño: "la web podría estar totalmente dividida en los dos colores cuando
   presionas una de las opciones". No es un tema claro/oscuro: es de QUIÉN es la pantalla.
   Elegir Signatures te pone en el mundo de SANDO; elegir ARMA EL TUYO te pasa al de WICHO,
   y la app entera se va con él.
   Esto solo se puede hacer barato porque la paleta ya son tokens: se reasignan las
   SUPERFICIES y basta — no hay que tocar ni uno de los 997 sitios que las usan. Antes de
   los tokens, esto habría sido reescribir la app.
   ⚠ El dorado NO se toca. Es el color del dinero (precios, totales, recompensas) y tiene
   que verse igual en los dos lados: un precio que cambia de color según dónde estás es
   exactamente la clase de duda que no queremos en un checkout. */
:root[data-lado="wicho"]{
  --sw-bg:#102430;
  --sw-card:#1C3B4D;
  --sw-card2:#142C3A;
  --sw-card-danger:#1E1A22;
  --sw-border:#2F6180;
  --sw-border-soft:#12222C;
  --sw-text:#FFFFFF;
  --sw-text-body:#EAF2F6;
  --sw-text-muted:#A6C9DD;
  --sw-text-muted2:#89AFC6;
  --sw-text-muted3:#7B9FB4;
  --sw-text-muted4:#C6DCE8;
}
/* La transición es del FONDO, no de cada elemento: animar 997 nodos a la vez hace tironear
   cualquier teléfono de gama baja. Así solo se interpolan los pocos que pintan superficie. */
body,#app{transition:background-color .42s ease}

/* Modo claro del panel admin — antes era filter:invert(1) hue-rotate(180deg) sobre todo
   el contenedor, lo que invertía matemáticamente el dorado de marca (#CBA258) a un olivo
   lavado (hallazgo de auditoría visual). Ahora es una paleta clara de verdad: cada
   superficie/texto neutro del panel admin usa una custom property con el valor oscuro
   actual como fallback (así cualquier pantalla que NO esté dentro de .admin-light se ve
   exactamente igual que antes, cero regresión), y .admin-light solo redefine esas
   properties. Los colores semánticos/de estado (naranja, verde, rojo, azul, morado) SÍ se
   reasignan a variantes oscurecidas verificadas por contraste (≥4.5:1 WCAG AA) mientras se
   renderiza una pantalla admin en modo claro — ver STATUSES[k].c en render()/app.ts, mismo
   mecanismo que GOLD (comentario corregido: la versión anterior de esta nota decía "sin
   cambio entre temas", pero el código de app.ts ya no es así desde antes de esta sesión).
   El dorado de marca (variable JS GOLD) se reasigna a un tono más oscuro solo mientras se
   renderiza una pantalla admin en modo claro (ver toggleAdminLight/render en app.ts). */
.admin-light{
  --sw-bg:#F3EEE1;
  --sw-card:#FFFFFF;
  --sw-card2:#F1EBDA;
  --sw-card-danger:#FBEAEA;
  --sw-card-muted:#EAE3D0;
  --sw-border:#D9D0BA;
  --sw-border-soft:#DDD5BE;
  --sw-border-muted:#DCD3BB;
  --sw-text:#241C10;
  --sw-text-body:#3A2F1D;
  --sw-text-muted:#6B6350;
  --sw-text-muted2:#877D68;
  --sw-text-muted3:#9C9480;
  --sw-text-muted4:#4A4230;
}
/* Identidad admin "Modo cocina de una mano" (elegida por el dueño entre 3 mockups,
   2026-07-29) — reemplaza la piel "misma que el cliente" que tenía el admin antes.
   .admin-dark es el estado por defecto (antes el admin oscuro no tenía NINGUNA clase
   propia, solo heredaba los valores de fallback del cliente #1E3932/etc. — por eso hacía
   falta esta clase nueva, no solo ajustar .admin-light). Negro puro + un solo acento ámbar
   (ver GOLD reasignado en render()/app.ts, mismo mecanismo ya usado para adminLight)
   pensado para legibilidad bajo luz de cocina y con el pulgar, no para "verse elegante". */
.admin-dark{
  --sw-bg:#000000;
  --sw-card:#161616;
  --sw-card2:#0D0D0D;
  --sw-card-danger:#2A1010;
  --sw-card-muted:#141414;
  --sw-border:#2A2A2A;
  --sw-border-soft:#1F1F1F;
  --sw-border-muted:#242424;
  --sw-text:#FFFFFF;
  --sw-text-body:#F2F2F2;
  --sw-text-muted:#9A9A9A;
  --sw-text-muted2:#7D7D7D;
  --sw-text-muted3:#666666;
  --sw-text-muted4:#B3B3B3;
}
/* Tipografía humanista sin serifs finos para TODO el admin (dark y light) — las astas
   finas de Bodoni Moda pierden legibilidad con glare de pantalla en cocina/exteriores.
   `!important` + selector universal es necesario porque casi cada elemento de texto en
   sAdmin*/DTILE/etc. trae su propio font-family inline (máxima especificidad CSS) —
   ninguna regla de clase sin !important podría ganarle. Nunca toca el cliente (o_*/p_*),
   que nunca recibe estas clases. */
.admin-dark,.admin-dark *,.admin-light,.admin-light *{
  font-family:'Public Sans','Segoe UI',system-ui,-apple-system,sans-serif!important;
}
/* El wordmark "//" (.wm-mark, ver más abajo) lleva UNA BARRA POR HERMANO. Acá se
   reemplazan los dos colores por los del panel, que tiene sus propios fondos: en el claro
   el celeste del cliente sería casi invisible, así que cada tema trae su par. Se conserva
   el bicolor porque es la marca, no un adorno del cliente. */
.admin-dark .wm-mark i:first-child{background:#FFC966}
.admin-dark .wm-mark i:last-child{background:#7FC4EE}
.admin-light .wm-mark i:first-child{background:#8A5000}
.admin-light .wm-mark i:last-child{background:#1F5F86}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#1E3932;min-height:100%;-webkit-tap-highlight-color:transparent}
body{font-family:'EB Garamond',serif;color:#fff;position:relative;font-variant-numeric:lining-nums tabular-nums}
.cut-sep{}
/* Marca "//" del wordmark — dos barras sesgadas, en vez del simple glifo "//" (que en
   fuentes display de alto contraste casi no se ve a tamaños chicos). Solo se usa en
   WORDMARK(); el "//" suelto dentro de copy en cualquier otra parte sigue usando
   .cut-sep, mucho más liviano para 40+ apariciones en botones y labels.

   ── UNA BARRA POR HERMANO (variante C, decisión del dueño 2026-09-10) ──
   Izquierda dorada = SANDO. Derecha celeste = WICHO. El "//" siempre fue el corte del
   pan; ahora además dice QUIÉN lo hace, y el logo cuenta lo mismo que el producto.

   Antes las dos barras eran doradas con degradado, a .15em de ancho: el dueño lo rechazó
   como "dorado grueso" y tenía razón — a ese grosor no se lee como corte sino como dos
   bloques que empujan las letras. Ahora .10em y color PLANO, sin degradado: dos trazos de
   cuchillo.

   ⚠ LAS DOS BARRAS SON IDÉNTICAS EN FORMA y eso no se negocia (ver punto 10 del
   CLAUDE.md): `width`/`height`/`transform`/`border-radius` viven en UNA regla compartida
   por las dos, y lo único que se separa es el `background`. Nunca las dibujes con
   tamaños distintos. */
.wm-mark{display:inline-flex;align-items:center;gap:.16em;margin:0 .08em;vertical-align:-.04em}
.wm-mark i{display:inline-block;width:.10em;height:.88em;transform:skewX(-16deg);border-radius:1px}
.wm-mark i:first-child{background:#CBA258}
.wm-mark i:last-child{background:#8CC8EC}
/* min-height doble a propósito: 100vh primero como respaldo para navegadores sin
   soporte de dvh, y 100dvh encima, que es la que respeta la barra de URL de Chrome
   Android (con 100vh la última sección quedaba fuera de pantalla y el scroll saltaba).
   El padding inferior reserva el alto de la barra fija de navegación (49px) más el
   área segura del indicador de inicio de iOS — antes el contenido quedaba debajo. */
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-bottom:calc(49px + env(safe-area-inset-bottom,0px));background:#1E3932;position:relative;z-index:1;box-sizing:border-box}
::-webkit-scrollbar{width:0}
input{outline:none;border:none;font-family:'EB Garamond',serif}
input::placeholder{color:var(--sw-text-muted,#A8C8B0);font-size:13px}
button{cursor:pointer;border:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.pulse{animation:pulse 1.8s infinite}
/* "Bump" breve al sumar/restar cantidad — como el nodo se recrea en cada render()
   (innerHTML completo), la animación se reproduce sola cada vez sin JS adicional. */
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.bump{animation:bump .25s ease}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.blink{animation:blink 1.4s infinite}
/* Celebración de rango en sOSent() — antes rankName() era puramente informativo, sin
   ningún momento que marcara cruzar un umbral (ej. NUEVO -> REGULAR, o desbloquear THE
   VAULT en INICIADO). Un solo "pop" con leve overshoot, nada más — no hace falta
   confetti para que se sienta como un logro. */
@keyframes rankpop{0%{transform:scale(0) rotate(-6deg);opacity:0}60%{transform:scale(1.12) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0deg)}}
.rank-pop{animation:rankpop .5s cubic-bezier(.34,1.56,.64,1)}
@media (prefers-reduced-motion: reduce){.rank-pop{animation:none}}

input,textarea,select{color:#F2F0EB !important}
input::placeholder,textarea::placeholder{color:#A8C8B0 !important;opacity:1}
input:focus,textarea:focus{outline:none;border-color:#CBA258 !important;box-shadow:0 0 0 2px rgba(203,162,88,.15)}
/* Foco de teclado visible en botones/tarjetas interactivas — hallazgo de la re-auditoría
   de 10 agentes (ALTO): casi todo elemento interactivo usa style="all:unset;..." (74
   apariciones), lo que borra el outline nativo del navegador sin dejar NINGÚN indicador de
   foco propio — imposible saber qué botón está seleccionado navegando con teclado/switch-
   access. El !important es necesario porque all:unset es un estilo INLINE (máxima
   especificidad) — solo un !important en la hoja de estilos puede ganarle. Se aplica a
   cualquier elemento con cursor:pointer (la convención ya usada en este archivo para
   "esto es interactivo", ver [style*="cursor:pointer"] más abajo) más button/a genéricos
   por si acaso. */
[style*="cursor:pointer"]:focus-visible,button:focus-visible,a:focus-visible{
  outline:2px solid #CBA258 !important;
  outline-offset:2px !important;
}
/* Transición de entrada de cada pantalla — antes había dos definiciones
   distintas de .fi (una quedaba muerta, sobreescrita por la segunda);
   se deja una sola. Un leve scale-in además del translateY le da más cuerpo
   al cambio de pantalla sin volverse lento ni notorio como para distraer. */
.fi{animation:fi .32s cubic-bezier(.16,1,.3,1)}
@keyframes fi{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.fi{animation:none}}
/* render() agrega esta clase al body cuando solo se actualiza la pantalla
   actual (ej. tocar un topping) en vez de navegar a una nueva — así la
   animación .fi no se reproduce en cada micro-interacción. */
body.no-fi .fi{animation:none}
/* Con el teclado virtual abierto la barra fija de navegación tapa los campos del
   formulario (medido: a 320x330 caía encima del campo de teléfono del checkout).
   El listener de visualViewport en app.ts pone body.kb-open. También se quita el
   padding inferior que reserva su alto, porque la barra ya no está ocupándolo. */
body.kb-open .bottom-nav{display:none!important}
body.kb-open #app{padding-bottom:0}
/* Feedback táctil sutil en cualquier elemento interactivo (todos marcados con
   cursor:pointer en su style inline) — antes ningún botón/tarjeta daba señal
   visual al presionar, solo cambiaba de pantalla/estado sin transición. */
[style*="cursor:pointer"]{transition:transform .08s ease}
[style*="cursor:pointer"]:active{transform:scale(.97)}
@media (prefers-reduced-motion: reduce){[style*="cursor:pointer"]{transition:none}[style*="cursor:pointer"]:active{transform:none}}
</style>
<style>
#mmap{display:none;position:fixed;inset:0;background:#1E3932;z-index:9999;flex-direction:column}
#mmap.open{display:flex}
#lmap{flex:1;min-height:0}
#mpin{position:absolute;top:50%;left:50%;transform:translate(-50%,-110%);font-size:36px;z-index:9998;pointer-events:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.7))}
/* ── EL CORTE — vacío, no franja (2026-09-09, corregido el 2026-09-10) ────────
   La primera versión dibujaba dos barras DORADAS y gruesas entre los dos paneles. El
   dueño la rechazó por dos razones, las dos correctas:
     1. El wordmark ya tiene su "//" dorado arriba en la misma pantalla. Repetirlo grande
        y del mismo color deja de ser marca y pasa a ser ruido.
     2. En el logo el corte NO es una franja pintada: es un CORTE. Las dos mitades del
        mono se separan y entre ellas se ve el fondo. Dibujar una barra encima era la
        lectura contraria a la del propio logo.
   Ahora son dos ranuras del color del fondo: el panel se ve partido, no decorado. El
   único brillo es una línea de canto de un píxel, que es lo que hace que se lea como un
   corte con filo y no como un hueco. */
.sw-cut{display:flex;gap:5px;align-items:stretch;flex-shrink:0;pointer-events:none;height:100%}
.sw-cut i{display:block;width:7px;background:var(--sw-bg,#1E3932);
  transform:skewX(-16deg);box-shadow:1px 0 0 rgba(233,201,138,.5),-1px 0 0 rgba(0,0,0,.35)}
/* ── LOS HERMANOS COMO ELEMENTO DE INTERFAZ (2026-09-10) ──────────────────────
   `img/sando.png` e `img/wicho.png` son las DOS MITADES del logo del dueño, partido por
   su costura central — no son dibujos nuevos. SANDO es la mitad verde (párpado caído, el
   que ya decidió: los Signatures); WICHO la celeste (ojo en espiral, el que elige: ARMA
   EL TUYO). Cada uno vive de su lado y REACCIONA cuando lo tocas, que es lo que los
   convierte en interfaz en vez de decoración.
   ⚠ No hay más estados que éstos: son recortes de una sola ilustración. Una sonrisa nueva
   de SANDO o una pose de WICHO señalando exigen DIBUJO nuevo, que solo puede encargar el
   dueño — igual que el RUC o las fotos de producto. Lo que sí se puede animar sin inventar
   nada es lo que es geometría: su ojo espiral, que se redibuja en SVG. */
.sw-bro{position:relative;flex-shrink:0;line-height:0}
.sw-bro img{display:block;width:100%;height:auto}
/* La reacción al tocar. SANDO se yergue —el que mide antes de moverse— y WICHO se lanza
   hacia adelante. Son las dos personalidades, no dos animaciones distintas por gusto. */
.sw-bro-sando{transform-origin:bottom center;transition:transform .34s cubic-bezier(.34,1.56,.64,1)}
.sw-bro-wicho{transform-origin:bottom center;transition:transform .34s cubic-bezier(.34,1.56,.64,1)}
.sw-on .sw-bro-sando{transform:translateY(-6px) scale(1.05) rotate(-2deg)}
.sw-on .sw-bro-wicho{transform:translateY(-9px) scale(1.09) rotate(3deg)}
/* El ojo espiral de WICHO, encima del que ya trae la ilustración. Las medidas salen de
   muestrear el archivo: centro al 27% / 43.6% y radio 11.4% del ancho. Si algún día
   cambia el logo, esto se descuadra — por eso está anotado de dónde salen. */
/* ── LA REACCIÓN DEL HERMANO ────────────────────────────────────────────────────────
   Pedido del dueño: "cuando le des click a la opción sus ojos giren, algo más visual, e
   igual con la parte de SANDO que sonría cuando presionan".

   Lo que se puede hacer honestamente con el dibujo que existe:
     · WICHO — su ojo espiral es GEOMETRÍA y se redibuja en SVG (SPIRAL()), así que gira
       de verdad. Ésa es su reacción y no depende de que nadie dibuje otro cuadro.
     · SANDO — una sonrisa nueva ES un dibujo nuevo, y eso lo encarga el dueño (está
       anotado en marca/PERSONAJES.md junto a las otras dos poses que faltan). Lo que sí
       es honesto mientras tanto es que REACCIONE: un asentimiento sobre la pose que ya
       existe. Es movimiento sobre el dibujo real, no un dibujo inventado.

   No hace falta ningún estado en JS para dispararlo: la app rehace el DOM entero en cada
   render(), y dentro del armador y de la lista de Signatures un render() ocurre
   exactamente cuando el cliente toca una opción. Un elemento recién creado reproduce su
   animación desde el principio, así que el hermano reacciona a cada toque y a nada más. */
@keyframes sw-nudge{
  0%{transform:translateY(0) rotate(0)}
  38%{transform:translateY(-7px) rotate(-2.5deg)}
  70%{transform:translateY(1px) rotate(1deg)}
  100%{transform:translateY(0) rotate(0)}
}
.sw-nudge{animation:sw-nudge .5s cubic-bezier(.34,1.56,.64,1);transform-origin:bottom center}
@media (prefers-reduced-motion:reduce){.sw-nudge{animation:none}}

function resumeWantedGroup() {

}
async function doCreateGroupOrder() {
    if (!cust) {
        showToast('Inicia sesión para organizar un pedido grupal.');
        return;
    }
    busy = true;
    busyMsg = 'Creando pedido grupal...';
    render();
    var res;
    try {
        res = await api('create-group-order', { token: token });
    }
    catch (e) {
        busy = false;
        render();
        showToast(e.message);
        return;
    }
    groupCode = res.code;
    groupData = null;
    groupMsg = '';
    busy = false;
    sndScreen = 'group_order';
    render();
    loadGroupOrder();
    startGroupPoll();
}
async function loadGroupOrder() {
    if (!groupCode)
        return;
    try {
        var res = await api('get-group-order', { token: token, code: groupCode });
        groupData = res;
        render();
    }
    catch (e) {
        stopGroupPoll();
        showToast(e.message);
        sndScreen = 'o_home';
        render();
    }

            window._lastGuestEmail = (r.prefill && r.prefill.email) || '';

            // (mínimo 4 dígitos) para poder crear la cuenta, y quien viene de Google se
            // enteraba de eso recién al tocar CREAR CUENTA (hallazgo de auditoría UX).

        isAdmin = r.isAdmin;
        token = r.token;
        cacheCust(cust, isAdmin);

        localStorage.setItem('sw_tok', token);
        savedPh = cust.phone;
        busy = false;
        sndScreen = 'p_home';
        render();

// pedido — el permiso de ubicación, el mapa, el reverse geocoding que rellena el distrito
// y el buscador de direcciones. Estaba en el archivo equivocado, y eso tenía un costo
// concreto: mientras el flujo de dirección del cliente viva dentro del archivo del panel,
// el panel NO se puede sacar del bundle que descarga cada cliente (39% del código, ver
// ARQUITECTURA.md). Moverlo acá, junto al checkout que lo usa, es el primer paso de eso.

// Tarjeta de regalo digital: se paga con puntos PROPIOS y acredita saldo a OTRO cliente
// — distinta de doCreditGift (que transfiere saldo ya propio, sin gastar puntos).
// Rediseño de esta sesión: antes cobraba de verdad por Culqi (dos pasos, prepare +
// widget + confirm) porque Culqi no soporta "cobrar con puntos" — el dueño pidió
// corregirlo a la intención original. Ahora es una sola llamada atómica al servidor
// (redeem_points_for_gift_credit), sin cobro, reserva, ni ventana de expiración.
// ── MONTOS SUGERIDOS, TRADUCIDOS A PRODUCTO ──────────────────────────────────────────
// Regalar exige decidir un número, y decidir un número en abstracto es justo donde la gente
// abandona: "¿cuánto es suficiente para un regalo?" no tiene respuesta hasta que alguien
// dice qué compra ese monto.
//
// ⚠ LOS MONTOS SE DERIVAN DEL CATÁLOGO, NO SE ESCRIBEN. Si un Signature sube de precio, un
// monto fijo escrito acá pasaría a NO alcanzar para lo que promete — un regalo que se queda
// corto en la caja es peor que no haberlo sugerido. Se redondea hacia ARRIBA al múltiplo de
// cinco por lo mismo: el error nunca puede caer del lado de que no alcance.
function giftSugerencias() {
    // El menú secreto se excluye: su precio no es representativo de la carta pública y el
    // destinatario puede ni siquiera tenerlo desbloqueado.
    var publicos = SIGS.filter(function (x) { return !x.secret; });
    if (!publicos.length)
        publicos = SIGS;
    var arriba5 = function (v) { return Math.max(GIFT_CARD_AMOUNT_MIN, Math.ceil(v / 5) * 5); };
    var p15 = Math.min.apply(null, publicos.map(function (x) { return x.p15 || 0; }).filter(Boolean));
    var p30 = Math.min.apply(null, publicos.map(function (x) { return x.p30 || 0; }).filter(Boolean));
    if (!isFinite(p15) || !p15)
        return [];
    var lista = [
        { v: arriba5(p15), t: 'Un 15CM' },
        { v: arriba5(p30 || p15 * 1.4), t: 'Un 30CM' },
        { v: arriba5(p15 * 2), t: 'Dos 15CM' }
    ];
    // Sin duplicados y dentro del rango que el servidor acepta — ofrecer un monto que el
    // checkout va a rechazar es peor que no ofrecerlo.
    var vistos = {}, out = [];
    lista.forEach(function (x) {
        if (vistos[x.v] || x.v > GIFT_CARD_AMOUNT_MAX)
            return;
        vistos[x.v] = 1;
        out.push(x);
    });
    return out;
}

        });

        if (!resp.ok || !data.success) {

            wpMsg = data.error || 'El pago fue rechazado. Intenta de nuevo o con otro método.';
            _pendingWeeklyPlan = null;
            render();
            return;
        }
        try {
            await api('confirm-weekly-plan', { token: token, chargeId: data.chargeId, ref: pw.ref });
        }
        catch (e) {
            busy = false;
            _weeklyPlanBuyInProgress = false;
            wpCritical = true;
            wpMsg = (e.message || 'No se pudo confirmar tu Plan Semanal.') + ' Ya se realizó el cobro — contáctanos con tu referencia ' + pw.ref + ' para confirmar el saldo manualmente. No vuelvas a intentar pagar.';
            _pendingWeeklyPlan = null;
            render();
            return;
        }
        var r = await api('session-check', { token: token });
        if (r.valid) {

            cacheCust(cust, isAdmin);
        }
        busy = false;
        _weeklyPlanBuyInProgress = false;
        wpEmail = '';
        _pendingWeeklyPlan = null;
        showToast('¡Listo! Recibiste ' + SOLES + pz(pw.creditAmount) + ' en saldo.');
        sndScreen = 'p_profile';
        render();
    }
    catch (e) {
        // Mismo riesgo que el catch de arriba (confirm-weekly-plan falló): no sabemos si el
        // cargo llegó a ejecutarse antes de que se cortara la conexión.
        busy = false;
        _weeklyPlanBuyInProgress = false;
        wpCritical = true;
        wpMsg = 'No pudimos confirmar si el pago se procesó (falló la conexión). Antes de reintentar, contáctanos con tu referencia ' + pw.ref + ' para verificar si ya se hizo el cobro.';

// ── #28: LECTURA DEL COMPROBANTE, SIN COSTO ────────────────────────────────────────────
//
// Tesseract.js corre en ESTE navegador: sin cuenta, sin API key, sin servicio externo, sin
// costo por uso. Se carga bajo demanda y solo acá, así que los ~3 MB del motor los descarga
// el dueño la primera vez que abre un comprobante — ningún cliente los ve nunca.
//
// ⚠ NO CONFIRMA EL PAGO, y no puede: una captura se edita en dos minutos. Hace los tres
// chequeos que el dueño haría a ojo (monto, fecha, número de operación) para que no tenga
// que entrecerrarlos. La confirmación sigue siendo suya, mirando su cuenta.
var receiptOcrState = {}, _tesseractPromise = null;

// martes cualquiera sin que nadie toque este repo.
var TESSERACT_CDN = 'https://cdn.jsdelivr.net/npm/tesseract.js@6.0.0/dist/tesseract.min.js';
function loadTesseract() {
    if (window.Tesseract)
        return Promise.resolve(window.Tesseract);
    if (_tesseractPromise)
        return _tesseractPromise;
    _tesseractPromise = new Promise(function (resolve, reject) {
        var sc = document.createElement('script');
        sc.src = TESSERACT_CDN;
        sc.onload = function () { resolve(window.Tesseract); };
        // Sin conexión, con el CDN caído o con un bloqueador de por medio, esto rechaza y el
        // comprobante se sigue viendo igual que siempre. El OCR es un extra, nunca un requisito.
        sc.onerror = function () { _tesseractPromise = null; reject(new Error('No se pudo cargar el lector.')); };
        document.head.appendChild(sc);

    return _tesseractPromise;

async function readReceipt(ordId, url) {
    var o = (adminOrders || []).find(function (x) { return x.id === ordId; });
    if (!o)
        return;
    receiptOcrState[o.ref] = { loading: true };
    render();
    try {
        var T = await loadTesseract();
        // 'spa' — los rótulos de la constancia están en español. El motor descarga el modelo del
        // idioma la primera vez y lo deja en caché del navegador.
        var res = await T.recognize(url, 'spa');
        var texto = (res && res.data && res.data.text) || '';
        // El texto se manda al SERVIDOR para interpretarlo: ahí vive el parser probado, y ahí
        // está la tabla contra la que se comprueba si esa misma operación ya respaldó otro
        // pedido — algo que este navegador no puede saber solo.
        var r = await api('admin-receipt-ocr', { token: token, ref: o.ref, text: texto });
        receiptOcrState[o.ref] = { fields: r.fields, checks: r.checks };
    }
    catch (e) {
        receiptOcrState[o.ref] = { error: e.message || 'No se pudo leer el comprobante.' };

        return;

    // defecto) no tenía ninguna clase propia y heredaba el verde+dorado del cliente sin
    // querer; ahora SIEMPRE es un tema propio (negro puro + ámbar en oscuro, la paleta
    // clara ya existente en claro), nunca la piel del cliente. GOLD y STATUSES.c son
    // variables JS reasignables (mismo mecanismo ya usado antes solo para el modo claro),
    // así que todo lo que ya concatena '+GOLD+'/lee STATUSES[x].c en sAdmin*/DTILE/etc.
    // recoge el valor correcto sin tocar cada aparición individual.
    var adminScope = sndScreen.indexOf('admin') === 0;
    var adminLight = adminScope && adminLightMode;
    var _prevGold = GOLD;
    if (adminScope)
        GOLD = adminLight ? '#8A5000' : '#FFB020';
    // Semáforo de 3 colores (rojo/ámbar/verde) — nada de morado/azul decorativo, a
    // propósito: en "Modo cocina de una mano" el color se gasta SOLO en decir "qué tan
    // urgente/avanzado" un pedido, nunca como decoración. En claro se reusan variantes
    // oscurecidas ya verificadas por contraste WCAG AA (≥4.46:1) de la pasada anterior.
    var _prevStatusColors = null;
    if (adminScope) {
        _prevStatusColors = {};
        Object.keys(STATUSES).forEach(function (k) { _prevStatusColors[k] = STATUSES[k].c; });
        if (adminLight) {
            STATUSES.RECIBIDO.c = '#B23A3A';
            STATUSES.PREPARANDO.c = '#8A5000';
            STATUSES['EN CAMINO'].c = '#A85200';
            STATUSES.ENTREGADO.c = '#1B6B35';
            STATUSES.CANCELADO.c = '#6B6350';
        }
        else {
            STATUSES.RECIBIDO.c = '#FF4D4D';
            STATUSES.PREPARANDO.c = '#FFB020';
            STATUSES['EN CAMINO'].c = '#FF8A00';
            STATUSES.ENTREGADO.c = '#3DDC84';
            STATUSES.CANCELADO.c = '#8A8A8A';
        }
    }
    switch (sndScreen) {
        case 'o_home':
            h = sOHome();
            break;
        case 'o_sig':
            h = sOSig();
            break;
        case 'o_build':
            h = sOBuild();
            break;
        case 'o_item_confirm':
            h = sOItemConfirm();
            break;
        case 'o_cart':
            h = sOCart();
            break;
        case 'o_sides':
            h = sOSides();
            break;
        case 'o_sent':
            h = sOSent();
            break;
        case 'p_auth':
            h = sPAuth();
            break;
        case 'p_welcome':
            h = sWelcome();
            break;
        case 'p_recover':
            h = sPRecover();
            break;
        case 'p_legal':
            h = sPLegal();
            break;
        case 'p_returns':
            h = sPReturns();
            break;
        case 'p_complaints':
            h = sPComplaints();
            break;
        case 'p_home':
            h = sPHome();
            break;
        case 'p_rewards':
            h = sPRewards();
            break;
        case 'p_history':
            h = sPHistory();
            break;
        case 'p_orders':
            h = sPOrders();
            break;
        case 'p_ord_detail':
            h = sOrdDetail();
            break;
        case 'p_profile':
            h = sPProfile();
            break;
        case 'p_favorites':
            h = sPFavorites();
            break;
        case 'p_recurring':
            h = sPRecurring();
            break;
        case 'gift_card':
            h = sGiftCard();
            break;
        case 'weekly_plan':
            h = sWeeklyPlan();
            break;
        case 'group_order':
            h = sGroupOrder();
            break;
        case 'p_addresses':
            h = sPAddresses();
            break;
        case 'delivery_confirm':
            h = sDeliveryConfirm();
            break;
        // ── LAS 34 PANTALLAS DEL PANEL YA NO ESTÁN ESCRITAS ACÁ ────────────────────────
        // Estaban como 34 `case` fijos, y eso era lo que ataba el router al panel: mientras el
        // router nombrara cada pantalla de admin, el panel no se podía sacar del bundle que
        // descarga TODO cliente que abre la carta.
        //
        // Ahora el panel se registra a sí mismo en `ADMIN_SCREENS` al cargarse y el router solo
        // pregunta. Si el panel no está cargado no hay entrada y cae al home del cliente — que
        // es exactamente lo que tiene que pasar cuando alguien sin sesión de admin escribe una
        // pantalla de admin en la URL.
        default:
            var pantallaAdmin = ADMIN_SCREENS[sndScreen];
            // Si el panel no cargó, se DICE. Caer al home del cliente en silencio dejaría al
            // dueño sin panel y sin ninguna pista de por qué — el peor de los dos errores.
            h = pantallaAdmin
                ? pantallaAdmin()
                : (adminBundleError
                    ? '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;gap:14px">'
                        + '<div style="font-family:\'Bodoni Moda\',serif;font-size:18px;font-weight:640;color:var(--sw-text,#FFFFFF)">El panel no cargó</div>'
                        + '<p style="font-family:\'EB Garamond\',serif;font-size:13px;color:var(--sw-text-muted,#A8C8B0);max-width:280px;line-height:1.55">' + esc(adminBundleError) + '</p>'
                        + BTN('Reintentar //', 'adminBundleError=\'\';render()')
                        + '</div>'
                    : sOHome());
    }
    GOLD = _prevGold;
    if (_prevStatusColors)
        Object.keys(_prevStatusColors).forEach(function (k) { STATUSES[k].c = _prevStatusColors[k]; });
    var sameScreen = sndScreen === _lastRenderedSc, scrollY = window.scrollY;
    document.body.classList.toggle('no-fi', sameScreen);
    // Banner único y proactivo en vez de dejar que cada acción falle por separado con su
    // propio mensaje genérico — antes no había ninguna detección de modo sin conexión.
    var offlineBanner = isOffline ? '<div style="background:var(--sw-warn,#ffa500);color:#1a1200;text-align:center;padding:6px;font-family:\'EB Garamond\',serif;font-weight:600;font-size:11px;letter-spacing:.1em;display:flex;align-items:center;justify-content:center;gap:5px">' + icon('warning', 12, '#1a1200') + '<span>SIN CONEXIÓN — reconectando…</span></div>' : '';
    // Nunca mientras hay una operación en vuelo (un pago, por ejemplo): recargar en medio
    // de un cobro es exactamente lo que no queremos ofrecerle al cliente.
    var updateBanner = (updateReady && !busy) ? '<button type="button" onclick="applyAppUpdate()" style="width:100%;border:0;background:var(--sw-gold,#C9A227);color:#1a1200;text-align:center;padding:8px 6px;min-height:44px;font-family:\'EB Garamond\',serif;font-weight:600;font-size:11px;letter-spacing:.08em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px">' + icon('refresh', 13, '#1a1200') + '<span>NUEVA VERSIÓN DISPONIBLE — TOCA PARA ACTUALIZAR</span></button>' : '';
    document.getElementById('app').innerHTML = '<div class="' + (adminScope ? (adminLight ? 'admin-light' : 'admin-dark') : '') + '" style="min-height:100vh;display:flex;flex-direction:column;background:var(--sw-bg,#1E3932)">' + offlineBanner + updateBanner + h + '</div>';
    window.scrollTo(0, sameScreen ? scrollY : 0);
    _lastRenderedSc = sndScreen;
    if (sndScreen === 'p_auth')
        mountGoogleButton();
    renderOverlays();
    makeClickablesAccessible();
}

</script>
<div id="mmap"><div style="background:#2D5246;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #3A6B58;flex-shrink:0"><div style="font-family:'Bodoni Moda',serif;font-optical-sizing:auto;font-size:18px;font-weight:600;color:#FFFFFF">SELECCIONA DIRECCIÓN</div><button onclick="closeMap()" style="all:unset;cursor:pointer;color:#FFFFFF;font-size:22px;line-height:1;padding:4px 8px">&#10005;</button></div><div style="background:#111;padding:8px 16px;font-family:'EB Garamond',serif;font-style:italic;font-size:12px;color:#A8C8B0;flex-shrink:0">Escribe tu dirección abajo y elígela de la lista — o arrastra el mapa hasta el punto exacto</div><div id="mmap-accuracy-banner" style="display:none;background:rgba(255,165,0,.15);border-bottom:1px solid rgba(255,165,0,.3);padding:8px 16px;font-family:'EB Garamond',serif;font-style:italic;font-size:12px;color:#ffa500;flex-shrink:0">⚠ No detectamos tu ubicación real — este pin es aproximado. Arrástralo hasta tu dirección antes de confirmar.</div><div style="position:relative;flex:1;min-height:0"><div id="lmap" style="width:100%;height:100%"></div><div id="mpin">&#128205;</div></div><div style="background:#2D5246;padding:12px 16px;border-top:1px solid #3A6B58;flex-shrink:0"><div style="font-family:'EB Garamond',serif;font-weight:600;font-size:10px;color:#F2F0EB;opacity:.8;letter-spacing:.18em;text-transform:uppercase;margin-bottom:6px">Busca tu dirección //</div><div id="maddr-results" style="display:none;max-height:170px;overflow-y:auto;background:#1A3028;border:1px solid #3A6B58;border-radius:8px;margin-bottom:8px"></div><input id="maddr-input" type="text" autocomplete="off" placeholder="Ej: Av. España 123, Trujillo" oninput="addrSearchTyped()" onkeydown="if(event.key==='Enter'){event.preventDefault();addrSearchNow();}" style="background:#2D5246;border:1px solid #3A6B58;border-radius:8px;padding:12px 14px;color:#FFFFFF;width:100%;font-size:16px;font-family:'EB Garamond',serif;margin-bottom:10px;box-sizing:border-box"><div id="maddr-hint" style="font-family:'EB Garamond',serif;font-style:italic;font-size:12px;color:#A8C8B0;margin-bottom:10px;min-height:14px"></div><button onclick="confirmMap()" style="all:unset;cursor:pointer;display:block;width:100%;background:#3A86FF;color:#0d0d0d;font-family:'Bodoni Moda',serif;font-optical-sizing:auto;font-weight:600;font-size:15px;letter-spacing:.02em;padding:13px;border-radius:10px;text-align:center">CONFIRMAR DIRECCIÓN</button></div></div>
</body>
