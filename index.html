   el contenedor, lo que invertía matemáticamente el dorado de marca (#CBA258) a un olivo
   lavado (hallazgo de auditoría visual). Ahora es una paleta clara de verdad: cada
   superficie/texto neutro del panel admin usa una custom property con el valor oscuro
   actual como fallback (así cualquier pantalla que NO esté dentro de .admin-light se ve
   exactamente igual que antes, cero regresión), y .admin-light solo redefine esas
   properties. Los colores semánticos/de estado (naranja, verde, rojo, azul, morado) SÍ se
   reasignan a variantes oscurecidas verificadas por contraste (≥4.5:1 WCAG AA) mientras se
   renderiza una pantalla admin en modo claro — ver STATUSES[k].c en render()/app.ts, mismo
   mecanismo que GOLD (comentario corregido: la versión anterior de esta nota decía "sin
   cambio entre temas", pero el código de app.ts ya no es así desde antes de esta sesión).
   El dorado de marca (variable JS GOLD) se reasigna a un tono más oscuro solo mientras se
   renderiza una pantalla admin en modo claro (ver toggleAdminLight/render en app.ts). */
.admin-light{
  --sw-bg:#F3EEE1;
  --sw-card:#FFFFFF;
  --sw-card2:#F1EBDA;
  --sw-card-danger:#FBEAEA;
  --sw-card-muted:#EAE3D0;
  --sw-border:#D9D0BA;
  --sw-border-soft:#DDD5BE;
  --sw-border-muted:#DCD3BB;
  --sw-text:#241C10;
  --sw-text-body:#3A2F1D;
  --sw-text-muted:#6B6350;
  --sw-text-muted2:#877D68;
  --sw-text-muted3:#9C9480;
  --sw-text-muted4:#4A4230;
}
/* Identidad admin "Modo cocina de una mano" (elegida por el dueño entre 3 mockups,
   2026-07-29) — reemplaza la piel "misma que el cliente" que tenía el admin antes.
   .admin-dark es el estado por defecto (antes el admin oscuro no tenía NINGUNA clase
   propia, solo heredaba los valores de fallback del cliente #1E3932/etc. — por eso hacía
   falta esta clase nueva, no solo ajustar .admin-light). Negro puro + un solo acento ámbar
   (ver GOLD reasignado en render()/app.ts, mismo mecanismo ya usado para adminLight)
   pensado para legibilidad bajo luz de cocina y con el pulgar, no para "verse elegante". */
.admin-dark{
  --sw-bg:#000000;
  --sw-card:#161616;
  --sw-card2:#0D0D0D;
  --sw-card-danger:#2A1010;
  --sw-card-muted:#141414;
  --sw-border:#2A2A2A;
  --sw-border-soft:#1F1F1F;
  --sw-border-muted:#242424;
  --sw-text:#FFFFFF;
  --sw-text-body:#F2F2F2;
  --sw-text-muted:#9A9A9A;
  --sw-text-muted2:#7D7D7D;
  --sw-text-muted3:#666666;
  --sw-text-muted4:#B3B3B3;
}
/* Tipografía humanista sin serifs finos para TODO el admin (dark y light) — las astas
   finas de Bodoni Moda pierden legibilidad con glare de pantalla en cocina/exteriores.
   `!important` + selector universal es necesario porque casi cada elemento de texto en
   sAdmin*/DTILE/etc. trae su propio font-family inline (máxima especificidad CSS) —
   ninguna regla de clase sin !important podría ganarle. Nunca toca el cliente (o_*/p_*),
   que nunca recibe estas clases. */
.admin-dark,.admin-dark *,.admin-light,.admin-light *{
  font-family:'Public Sans','Segoe UI',system-ui,-apple-system,sans-serif!important;
}
/* El wordmark "//" (.wm-mark, ver más abajo) trae su degradado dorado fijo en la clase
   compartida con el cliente — estas 2 reglas lo reemplazan por el acento ámbar del admin
   sin tocar la regla original (mayor especificidad por combinador de clase, no hace falta
   !important acá porque .wm-mark i no trae ningún estilo inline que competir). */
.admin-dark .wm-mark i{background:linear-gradient(180deg,#FFC966,#FFB020)}
.admin-light .wm-mark i{background:linear-gradient(180deg,#8A5000,#6B3E00)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#1E3932;min-height:100%;-webkit-tap-highlight-color:transparent}
body{font-family:'EB Garamond',serif;color:#fff;position:relative;font-variant-numeric:lining-nums tabular-nums}
.cut-sep{}
/* Marca "//" del wordmark — dos barras sesgadas con degradado dorado, en vez del simple
   glifo "//" (que en fuentes display de alto contraste como Bodoni Moda casi no se ve a
   tamaños chicos). Solo se usa en WORDMARK(); el "//" suelto dentro de copy en cualquier
   otra parte sigue usando .cut-sep, mucho más liviano para 40+ apariciones en botones y
   labels. */
.wm-mark{display:inline-flex;align-items:center;gap:.13em;margin:0 .08em;vertical-align:-.04em}
.wm-mark i{display:inline-block;width:.15em;height:.82em;background:linear-gradient(180deg,#E9C98A,#CBA258);transform:skewX(-16deg);border-radius:1px}
/* min-height doble a propósito: 100vh primero como respaldo para navegadores sin
   soporte de dvh, y 100dvh encima, que es la que respeta la barra de URL de Chrome
   Android (con 100vh la última sección quedaba fuera de pantalla y el scroll saltaba).
   El padding inferior reserva el alto de la barra fija de navegación (49px) más el
   área segura del indicador de inicio de iOS — antes el contenido quedaba debajo. */
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-bottom:calc(49px + env(safe-area-inset-bottom,0px));background:#1E3932;position:relative;z-index:1;box-sizing:border-box}
::-webkit-scrollbar{width:0}
input{outline:none;border:none;font-family:'EB Garamond',serif}

button{cursor:pointer;border:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.pulse{animation:pulse 1.8s infinite}
/* "Bump" breve al sumar/restar cantidad — como el nodo se recrea en cada render()
   (innerHTML completo), la animación se reproduce sola cada vez sin JS adicional. */
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.bump{animation:bump .25s ease}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.blink{animation:blink 1.4s infinite}
/* Celebración de rango en sOSent() — antes rankName() era puramente informativo, sin
   ningún momento que marcara cruzar un umbral (ej. NUEVO -> REGULAR, o desbloquear THE
   VAULT en INICIADO). Un solo "pop" con leve overshoot, nada más — no hace falta
   confetti para que se sienta como un logro. */
@keyframes rankpop{0%{transform:scale(0) rotate(-6deg);opacity:0}60%{transform:scale(1.12) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0deg)}}
.rank-pop{animation:rankpop .5s cubic-bezier(.34,1.56,.64,1)}
@media (prefers-reduced-motion: reduce){.rank-pop{animation:none}}

input,textarea,select{color:#F2F0EB !important}
input::placeholder,textarea::placeholder{color:#A8C8B0 !important;opacity:1}
input:focus,textarea:focus{outline:none;border-color:#CBA258 !important;box-shadow:0 0 0 2px rgba(203,162,88,.15)}
/* Foco de teclado visible en botones/tarjetas interactivas — hallazgo de la re-auditoría
   de 10 agentes (ALTO): casi todo elemento interactivo usa style="all:unset;..." (74
   apariciones), lo que borra el outline nativo del navegador sin dejar NINGÚN indicador de
   foco propio — imposible saber qué botón está seleccionado navegando con teclado/switch-
   access. El !important es necesario porque all:unset es un estilo INLINE (máxima
   especificidad) — solo un !important en la hoja de estilos puede ganarle. Se aplica a
   cualquier elemento con cursor:pointer (la convención ya usada en este archivo para
   "esto es interactivo", ver [style*="cursor:pointer"] más abajo) más button/a genéricos
   por si acaso. */
[style*="cursor:pointer"]:focus-visible,button:focus-visible,a:focus-visible{
  outline:2px solid #CBA258 !important;
  outline-offset:2px !important;
}
/* Transición de entrada de cada pantalla — antes había dos definiciones
   distintas de .fi (una quedaba muerta, sobreescrita por la segunda);
   se deja una sola. Un leve scale-in además del translateY le da más cuerpo
   al cambio de pantalla sin volverse lento ni notorio como para distraer. */
.fi{animation:fi .32s cubic-bezier(.16,1,.3,1)}
@keyframes fi{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.fi{animation:none}}
/* render() agrega esta clase al body cuando solo se actualiza la pantalla
   actual (ej. tocar un topping) en vez de navegar a una nueva — así la
   animación .fi no se reproduce en cada micro-interacción. */
body.no-fi .fi{animation:none}
/* Con el teclado virtual abierto la barra fija de navegación tapa los campos del
   formulario (medido: a 320x330 caía encima del campo de teléfono del checkout).
   El listener de visualViewport en app.ts pone body.kb-open. También se quita el
   padding inferior que reserva su alto, porque la barra ya no está ocupándolo. */
body.kb-open .bottom-nav{display:none!important}
body.kb-open #app{padding-bottom:0}
/* Feedback táctil sutil en cualquier elemento interactivo (todos marcados con
   cursor:pointer en su style inline) — antes ningún botón/tarjeta daba señal
   visual al presionar, solo cambiaba de pantalla/estado sin transición. */
[style*="cursor:pointer"]{transition:transform .08s ease}
[style*="cursor:pointer"]:active{transform:scale(.97)}
@media (prefers-reduced-motion: reduce){[style*="cursor:pointer"]{transition:none}[style*="cursor:pointer"]:active{transform:none}}
</style>

// PEDIDO GRUPAL / DE OFICINA
// Cualquiera con el link agrega su propio Signature bajo su nombre, sin necesitar cuenta
// (solo quien organiza necesita sesión, para poder cerrar y pagar todo junto). Al cerrar,
// el servidor solo devuelve los items ya agregados — se cargan con loadCart() y de ahí en
// adelante es EXACTAMENTE el mismo carrito/checkout de siempre (combo, menú secreto, todo
// se valida igual), sin duplicar nada de esa lógica acá.
function shareGroupOrder() {
    var link = location.origin + location.pathname + '?group=' + encodeURIComponent(groupCode);
    var text = 'Únete a mi pedido grupal en SND//WCH y agrega tu sándwich: ' + link;
    if (navigator.share) {
        navigator.share({ title: 'SND//WCH', text: text, url: link }).catch(function () { });
    }
    else {
        window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
    }
}
// Se llama después de un login/registro exitoso: si el cliente llegó por el QR de la
// tarjeta (?grupo=1) sin sesión, esto retoma lo que venía a hacer en vez de dejarlo
// parado en la pantalla de puntos sin ninguna pista.
function resumeWantedGroup() {
    if (!wantsNewGroup || !cust)
        return false;
    wantsNewGroup = false;
    doCreateGroupOrder();
    return true;
}
async function doCreateGroupOrder() {
    if (!cust) {
        showToast('Inicia sesión para organizar un pedido grupal.');
        return;
    }
    busy = true;
    busyMsg = 'Creando pedido grupal...';
    render();
    var res;
    try {
        res = await api('create-group-order', { token: token });
    }
    catch (e) {
        busy = false;
        render();
        showToast(e.message);
        return;
    }
    groupCode = res.code;
    groupData = null;
    groupMsg = '';
    busy = false;
    sndScreen = 'group_order';
    render();
    loadGroupOrder();
    startGroupPoll();
}
async function loadGroupOrder() {
    if (!groupCode)
        return;
    try {
        var res = await api('get-group-order', { token: token, code: groupCode });
        groupData = res;
        render();
    }
    catch (e) {
        stopGroupPoll();
        showToast(e.message);
        sndScreen = 'o_home';
        render();
    }
}
function startGroupPoll() {
    stopGroupPoll();
    _groupPollTimer = setInterval(function () { if (sndScreen === 'group_order')
        loadGroupOrder();
    else
        stopGroupPoll(); }, 5000);
}
function stopGroupPoll() { if (_groupPollTimer) {
    clearInterval(_groupPollTimer);
    _groupPollTimer = null;
} }
async function submitGroupItem(item, okMsg) {
    var nameEl = document.getElementById('grp-name');
    var name = nameEl ? nameEl.value.trim() : groupJoinName;
    if (!name) {
        groupMsg = 'Ingresa tu nombre antes de agregar tu pedido.';
        render();
        return;
    }
    groupJoinName = name;
    try {
        localStorage.setItem('sw_group_name', name);
    }
    catch (e) { }
    try {
        // Manda token (vacío si es invitado) para que el servidor sepa si quien agrega es
        // quien organizó, y así no le mande una notificación push a sí mismo.
        await api('add-group-item', { code: groupCode, contributorName: name, token: token, item: item });
        groupMsg = okMsg;
        loadGroupOrder();
    }
    catch (e) {
        groupMsg = e.message;
        render();
    }
}
function doAddGroupItem(sigId) {
    submitGroupItem({ type: 'sig', sigId: sigId, size: groupSize, doubleProt: false, extraSauce: false, qty: 1 }, '¡Listo! Tu pedido se agregó.');
}

// quien solo quería sumar una bebida sin sándwich no tenía forma de hacerlo (hallazgo de
// auditoría UX). Mismo action del servidor (add-group-item -> priceCartItem ya valida
// item.type:'side' desde que existen los carritos multi-ítem), solo faltaba la UI.
function doAddGroupSide(code) {

}
async function doCloseGroupOrder() {
    if (!(await showConfirm('¿Cerrar el pedido grupal y continuar a pagar todo junto?')))
        return;
    busy = true;
    busyMsg = 'Cerrando pedido grupal...';
    render();
    var res;
    try {
        res = await api('close-group-order', { token: token, code: groupCode });
    }
    catch (e) {
        busy = false;
        render();
        showToast(e.message);
        return;
    }
    stopGroupPoll();
    busy = false;
    // Se recuerda de qué grupo salió este carrito para marcar el pedido resultante: sin esto
    // el pedido de una oficina de 6 sándwiches es indistinguible de uno normal y el canal no
    // se puede medir. Se limpia al confirmar (ver doOrder) para que no se pegue al siguiente.
    pendingGroupCode = groupCode;

async function doCancelGroupOrder() {
    if (!(await showConfirm('¿Cancelar este pedido grupal? Se perderá todo lo agregado.')))
        return;
    try {
        await api('cancel-group-order', { token: token, code: groupCode });
    }
    catch (e) {
        showToast(e.message);
        return;
    }
    stopGroupPoll();
    sndScreen = 'o_home';
    render();
}

async function chargeAndFinalize(culqiToken) {

        // falta reenviarlos ni confiar de nuevo en lo que diga el cliente en este paso).
        var res;

            res = await api('place-order', Object.assign({ token: token, chargeId: data.chargeId, ref: po.ref }, metaAttribution()));

            // desde aquí (crearía un SEGUNDO cobro real) y pedimos contactar al local con la ref.

            render();
            return;
        }
        finalizeOrderSuccess(res, po, data.chargeId);
    }
    catch (e) {
        busy = false;
        _payingInProgress = false;
        render();

async function doReg() {
    var name = gv('r-name').trim(), phone = gv('r-phone').trim(), pin = gv('r-pin').trim(), email = gv('r-email').trim(), dni = gv('r-dni').trim(), bdayRaw = gv('r-bday').trim(), refEl = document.getElementById('r-ref'), referredBy = refEl ? refEl.value.trim() : '';
    var err = document.getElementById('auth-err');
    if (!name || !phone || pin.length < 4) {
        if (err)
            err.textContent = 'Completa nombre, teléfono y PIN (mínimo 4 dígitos).';
        return;
    }
    // Mismo mínimo que ya exige el teléfono de contacto del checkout de invitado (línea de
    // doOrder más abajo) — antes el teléfono de CUENTA (login + código de referido) no
    // validaba ningún formato, a diferencia del DNI. Un typo creaba una cuenta que igual
    // loguea pero cuyo "código de referido" (el propio número) es inservible para quien lo
    // recibe (hallazgo de auditoría UX, ALTO).
    if (phone.replace(/\D/g, '').length < 6) {
        if (err)
            err.textContent = 'Ingresa un teléfono válido.';
        return;
    }
    if (!dni || !/^\d{8}$/.test(dni)) {
        if (err)
            err.textContent = 'DNI es obligatorio y debe tener 8 dígitos.';
        return;
    }

    // ninguna forma de recuperarse, con el mismo error genérico de "no encontramos una
    // cuenta" que credenciales incorrectas — indistinguible para el cliente (hallazgo de
    // auditoría UX, CRÍTICO).
    var bday = parseBdayDDMMYYYY(bdayRaw);

        return;

        // que en my-orders/submit-rating de invitado) — el servidor solo lo vincula si sigue

async function doLogin() {

        if (err)
            err.textContent = 'Ingresa teléfono y PIN.';
        return;
    }
    // Alguien usando el login manual no está en el flujo de Google — si había un vínculo de
    // Google pendiente de una persona anterior en este mismo dispositivo, se descarta acá
    // (ver clearGoogleLink()/hallazgo de auditoría de seguridad de esta sesión).
    clearGoogleLink();

    busyMsg = 'Verificando...';
    render();

        var r = await api('login', { phone: phone, pin: pin });
        cust = r.customer;
        isAdmin = r.isAdmin;
        token = r.token;
        cacheCust(cust, isAdmin);
    }
    catch (e) {
        aErr = e.message;
        busy = false;
        render();
        return;
    }
    localStorage.setItem('sw_ph', phone);
    localStorage.setItem('sw_tok', token);
    savedPh = phone;
    busy = false;
    sndScreen = 'p_home';
    render();

    resumeWantedGroup();

// Callback global de Google Identity Services (google.accounts.id.initialize) — recibe un
// credential (id_token JWT) que NUNCA se usa para iniciar sesión directamente acá: se manda
// al servidor (acción google-auth), que decide si ya existe una cuenta vinculada (login) o
// si falta completar el registro normal con DNI/teléfono/PIN (ver actGoogleAuth).
async function onGoogleCredential(resp) {
    if (!resp || !resp.credential)
        return;
    busy = true;
    busyMsg = 'Verificando con Google...';
    render();
    try {
        var r = await api('google-auth', { idToken: resp.credential });
        if (r.needsRegistration) {
            _googleIdToken = resp.credential;
            _googleLinkedEmail = (r.prefill && r.prefill.email) || (r.prefill && r.prefill.name) || 'tu cuenta de Google';
            window._lastGuestName = (r.prefill && r.prefill.name) || '';
            window._lastGuestEmail = (r.prefill && r.prefill.email) || '';
            atab = 'reg';
            aErr = '';
            busy = false;
            render();
            // Antes decía solo "DNI y teléfono" — el formulario también exige un PIN nuevo
            // (mínimo 4 dígitos) para poder crear la cuenta, y quien viene de Google se
            // enteraba de eso recién al tocar CREAR CUENTA (hallazgo de auditoría UX).
            showToast('Ya verificamos tu cuenta de Google — completa DNI, teléfono y crea un PIN para terminar tu registro.');
            return;
        }
        cust = r.customer;
        isAdmin = r.isAdmin;
        token = r.token;
        cacheCust(cust, isAdmin);
        localStorage.setItem('sw_ph', cust.phone);
        localStorage.setItem('sw_tok', token);
        savedPh = cust.phone;
        busy = false;
        sndScreen = 'p_home';
        render();
        loadUserExtras();
    }
    catch (e) {
        aErr = e.message;
        busy = false;
        render();
    }
}

// Monta el botón oficial de Google (renderButton — no un <button> propio, GIS exige su

// todo el innerHTML en cada ciclo, así que el mount anterior siempre queda destruido y

function payWeeklyPlanWithCulqi(amountSoles, email, ref) {
    if (typeof Culqi === 'undefined') {
        _weeklyPlanBuyInProgress = false;
        wpMsg = 'No se pudo cargar la pasarela de pago. Verifica tu conexión e intenta de nuevo.';
        _pendingWeeklyPlan = null;
        render();
        return;
    }
    if (!CULQI_PUBLIC_KEY || CULQI_PUBLIC_KEY.indexOf('REEMPLAZA') >= 0) {
        _weeklyPlanBuyInProgress = false;
        wpMsg = 'La pasarela de pago aún no está configurada. Contacta al administrador.';
        _pendingWeeklyPlan = null;
        render();
        return;
    }
    Culqi.publicKey = CULQI_PUBLIC_KEY;
    Culqi.settings({
        title: 'SND//WCH',
        currency: 'PEN',
        amount: Math.round(amountSoles * 100),
        description: 'Plan Semanal ' + ref
    });
    Culqi.options({
        lang: 'auto',
        installments: false,
        paymentMethods: { tarjeta: true, yape: true, billetera: false, bancaMovil: false, agente: false, cuotealo: false }
    });
    Culqi.open();
}
async function chargeAndFinalizeWeeklyPlan(culqiToken) {
    if (!_pendingWeeklyPlan)
        return;
    var pw = _pendingWeeklyPlan;
    busy = true;
    busyMsg = 'Procesando pago...';
    render();
    try {
        var resp = await fetch(CREDIT_CHARGE_FN_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: culqiToken, amountSoles: pw.amount, email: pw.email, ref: pw.ref })
        });
        var data = await resp.json().catch(function () { return {}; });
        if (!resp.ok || !data.success) {
            busy = false;
            _weeklyPlanBuyInProgress = false;
            wpMsg = data.error || 'El pago fue rechazado. Intenta de nuevo o con otro método.';
            _pendingWeeklyPlan = null;
            render();
            return;
        }
        try {
            await api('confirm-weekly-plan', { token: token, chargeId: data.chargeId, ref: pw.ref });
        }
        catch (e) {
            busy = false;
            _weeklyPlanBuyInProgress = false;
            wpCritical = true;
            wpMsg = (e.message || 'No se pudo confirmar tu Plan Semanal.') + ' Ya se realizó el cobro — contáctanos con tu referencia ' + pw.ref + ' para confirmar el saldo manualmente. No vuelvas a intentar pagar.';
            _pendingWeeklyPlan = null;
            render();
            return;
        }
        var r = await api('session-check', { token: token });
        if (r.valid) {
            cust = r.customer;
            cacheCust(cust, isAdmin);
        }
        busy = false;
        _weeklyPlanBuyInProgress = false;
        wpEmail = '';
        _pendingWeeklyPlan = null;
        showToast('¡Listo! Recibiste ' + SOLES + pw.creditAmount + ' en saldo.');
        sndScreen = 'p_profile';
        render();
    }
    catch (e) {
        // Mismo riesgo que el catch de arriba (confirm-weekly-plan falló): no sabemos si el
        // cargo llegó a ejecutarse antes de que se cortara la conexión.
        busy = false;
        _weeklyPlanBuyInProgress = false;
        wpCritical = true;
        wpMsg = 'No pudimos confirmar si el pago se procesó (falló la conexión). Antes de reintentar, contáctanos con tu referencia ' + pw.ref + ' para verificar si ya se hizo el cobro.';
        _pendingWeeklyPlan = null;
        render();
    }
}

    // siempre el mismo número. Para cambiarla en un pedido puntual está el botón de editar
    // ETA de la tarjeta, que sigue mandando etaMinutes explícito.
    var eta = null;
    _adminOrderActionInProgress = true;
    try {
        var r = await api('admin-update-status', { token: token, orderId: ordId, status: newSt, etaMinutes: eta });
        adminOrders = adminOrders.map(function (o) { return o.id === ordId ? r.order : o; });
        if (newSt === 'ENTREGADO')
            adminOrders = adminOrders.filter(function (o) { return o.id !== ordId; });
        _adminOrderActionInProgress = false;
        render();
    }
    catch (e) {
        // Antes este catch solo hacía console.warn y volvía: el servidor rechaza avanzar un
        // pedido Yape/Plin sin pago confirmado, así que el operador tocaba el botón grande,
        // no pasaba absolutamente nada visible, y volvía a tocar. El resto de acciones de
        // admin (confirmar pago, cancelar) sí avisan — esta era la única muda, y es la más
        // usada de todas.
        _adminOrderActionInProgress = false;
        showToast(e.message || 'No se pudo cambiar el estado del pedido.');
        render();
        return;
    }
    // El correo de cambio de estado ahora lo manda el propio servidor dentro de
    // admin-update-status (ver applyOrderStatusUpdate en orders.ts) — antes este cliente
    // llamaba directo a la función edge send-order-email sin ninguna autenticación (relay
    // de correo abierto + HTML sin escapar, hallazgo de auditoría de seguridad, CRÍTICO).
}
// El operador revisa su propia app de Yape/Plin y confirma aquí que el dinero llegó —
// recién entonces el pedido puede avanzar de RECIBIDO (el servidor también lo exige).
async function confirmOrderPayment(ordId) {
    if (_adminOrderActionInProgress)
        return;
    _adminOrderActionInProgress = true;
    try {
        var r = await api('admin-confirm-payment', { token: token, orderId: ordId });
        adminOrders = adminOrders.map(function (o) { return o.id === ordId ? r.order : o; });
        _adminOrderActionInProgress = false;
        render();
    }
    catch (e) {
        _adminOrderActionInProgress = false;
        showToast(e.message);
    }
}
// Antes confirmar el pago y pasar a preparación eran 2 taps separados (confirmar, luego
// tocar de nuevo "MARCAR COMO PREPARANDO") — en la inmensa mayoría de los casos el
// operador hace ambas cosas seguidas apenas ve el dinero en su app (hallazgo de la
// re-auditoría del panel admin). confirmOrderPayment sigue disponible aparte para el
// caso raro en que quiera confirmar el pago sin arrancar cocina todavía.
async function confirmAndAdvance(ordId) {
    if (_adminOrderActionInProgress)
        return;
    _adminOrderActionInProgress = true;
    try {
        await api('admin-confirm-payment', { token: token, orderId: ordId });
        var r = await api('admin-update-status', { token: token, orderId: ordId, status: 'PREPARANDO' });
        adminOrders = adminOrders.map(function (o) { return o.id === ordId ? r.order : o; });
        _adminOrderActionInProgress = false;
        render();
    }
    catch (e) {
        _adminOrderActionInProgress = false;
        showToast(e.message);
    }
}
// Cancela un pedido — libera el stock reservado (ver actAdminCancelOrder). Antes esto
// solo funcionaba para pedidos nunca pagados (Yape/Plin sin confirmar); un pedido ya
// pagado con tarjeta/crédito no se podía cancelar en la app aunque, por ejemplo, se
// acabara un ingrediente a media preparación (hallazgo de la auditoría de flujo de
// pedidos) — ahora sí, pero con una advertencia aparte de que el reembolso se coordina
// manualmente (esta acción no toca Culqi ni el saldo de crédito).
async function cancelOrder(ordId) {
    if (_adminOrderActionInProgress)
        return;
    var ord = (adminOrders || []).find(function (o) { return o.id === ordId; });
    var wasPaid = ord && ord.payment_status === 'paid';
    // Antes eran 2 modales secuenciales (confirmar → motivo) — fricción evitable justo en
    // una acción ya de por sí estresante (hallazgo de auditoría operativa, MEDIO). Un solo
    // showPrompt hace las dos cosas: cancelar el prompt (null) equivale a "no cancelar el
    // pedido"; aceptar (con o sin texto) confirma y captura el motivo opcional a la vez.
    var msg = (wasPaid
        ? '¿Cancelar este pedido? YA FUE PAGADO — tendrás que coordinar el reembolso tú mismo (Culqi/Yape/Plin/crédito), esto solo libera el stock reservado.'
        : '¿Cancelar este pedido? Se asume que el cliente nunca transfirió. Esto libera el stock reservado.')
        + '\n\n¿Por qué se cancela? (opcional, ayuda al resumen semanal)';
    var reason = await showPrompt(msg, '');
    if (reason === null)
        return; // admin canceló
    // Mismo guard que updateStatus/confirmOrderPayment/confirmAndAdvance — antes esta
    // acción era la única de la cola admin sin protección contra doble-tap (hallazgo de
    // auditoría de funcionamiento).
    _adminOrderActionInProgress = true;
    try {
        var r = await api('admin-cancel-order', { token: token, orderId: ordId, acknowledgeRefund: true, reason: reason || '' });
        adminOrders = adminOrders.filter(function (o) { return o.id !== ordId; });
        _adminOrderActionInProgress = false;
        render();
    }
    catch (e) {
        _adminOrderActionInProgress = false;
        showToast(e.message);
    }
}
function toggleBulkSelect(ordId) {
    if (bulkSelected[ordId])
        delete bulkSelected[ordId];
    else
        bulkSelected[ordId] = true;
    render();
}
// Confirma el pago Yape/Plin de todos los pedidos seleccionados que lo tengan pendiente
// de un solo tap — antes había que confirmar uno por uno (ver confirmOrderPayment),
// friccioso durante una tanda de varios pedidos simultáneos en hora pico (hallazgo de la
// auditoría del panel admin).
async function bulkConfirmPayments() {
    var ids = Object.keys(bulkSelected).filter(function (k) { return bulkSelected[k]; });
    var targets = ids.filter(function (id) {
        var o = (adminOrders || []).find(function (x) { return x.id === id; });
        return o && (o.payment_method === 'yape' || o.payment_method === 'plin') && o.payment_status !== 'paid';
    });
    if (!targets.length) {
        showToast('Ningún pedido seleccionado tiene un pago pendiente de confirmar.');
        return;
    }
    if (!(await showConfirm('¿Confirmar el pago de ' + targets.length + ' pedido(s)?')))
        return;
    busy = true;
    busyMsg = 'Confirmando pagos...';
    render();
    var okCount = 0, errs = [];
    for (var i = 0; i < targets.length; i++) {
        try {
            var r = await api('admin-confirm-payment', { token: token, orderId: targets[i] });
            adminOrders = adminOrders.map(function (o) { return o.id === targets[i] ? r.order : o; });
            okCount++;
        }
        catch (e) {
            errs.push(e.message);
        }
    }
    bulkSelected = {};
    busy = false;
    // Antes solo mostraba un conteo genérico ("N fallaron") — el operador tenía que revisar
    // manualmente cuál pedido falló y por qué, en medio de una tanda (hallazgo de auditoría
    // operativa, ALTO). Ahora muestra el motivo real (ej. "Confirma que el pago llegó...").
    if (errs.length)
        showToast(okCount + ' confirmado(s), ' + errs.length + ' fallaron: ' + errs.join(' · '));
    render();
}
// Avanza todos los pedidos seleccionados al mismo estado de un solo tap (ver #113 y
// actAdminBulkUpdateStatus) — cada pedido se procesa por separado en el servidor, así que
// un pago Yape/Plin sin confirmar en uno de ellos no bloquea al resto del lote.
async function bulkAdvanceStatus(status) {
    var ids = Object.keys(bulkSelected).filter(function (k) { return bulkSelected[k]; });
    if (!ids.length)
        return;
    // Mismo ETA que ya se pide al avanzar UN pedido a EN CAMINO (updateStatus) — antes el
    // lote nunca lo pedía, así que el cliente recibía el push genérico en vez de la ventana
    // de hora real (hallazgo de auditoría operativa, ALTO).
    var eta = null;
    if (status === 'EN CAMINO') {
        var etaStr = await showPrompt('¿Tiempo estimado de entrega en minutos (para los ' + ids.length + ' pedidos)?', '20', 'number');
        if (etaStr === null)
            return;
        eta = parseInt(etaStr, 10);
        if (!eta || eta <= 0)
            eta = 20;
    }
    if (!(await showConfirm('¿Marcar ' + ids.length + ' pedido(s) como ' + status + '?')))
        return;
    busy = true;
    busyMsg = 'Actualizando pedidos...';
    render();
    try {
        var r = await api('admin-bulk-update-status', { token: token, orderIds: ids, status: status, etaMinutes: eta });
        var updatedIds = {};
        (r.updated || []).forEach(function (o) { updatedIds[o.id] = o; });
        adminOrders = adminOrders.map(function (o) { return updatedIds[o.id] ? updatedIds[o.id] : o; });
        if (status === 'ENTREGADO')
            adminOrders = adminOrders.filter(function (o) { return !updatedIds[o.id]; });
        bulkSelected = {};
        // Antes solo mostraba un conteo genérico — el operador tenía que adivinar cuál pedido
        // falló y por qué (hallazgo de auditoría operativa, ALTO). El backend ya devuelve el
        // motivo real por pedido (r.failed[].error), solo faltaba mostrarlo.
        if (r.failed && r.failed.length)
            showToast(r.failed.length + ' pedido(s) no se pudieron actualizar: ' + r.failed.map(function (f) { return f.error; }).join(' · '));
    }
    catch (e) {
        showToast('Error: ' + e.message);
    }
    busy = false;
    render();
}
// Ticket de cocina imprimible (#114) — abre una ventana aparte con solo lo que cocina
// necesita ver (sin datos de cliente/entrega que no aportan al armado del pedido) y
// dispara el diálogo de impresión del navegador directamente.
function printTicket(ordId) {
    var o = (adminOrders || []).find(function (x) { return x.id === ordId; });
    if (!o)
        return;
    var items = Array.isArray(o.items) && o.items.length
        // Antes imprimía `it.label||it.sigId||it.prot||it.code` — y los ítems del carrito NO
        // tienen campo `label` (ver currentBuiltItem), así que el papel salía con códigos
        // internos: "1x P01", "1x SIG03". Ahora imprime el nombre real y la receta completa,
        // que es justo para lo que sirve un ticket de cocina.
        ? o.items.map(function (it) {
            var lines = itemRecipeLines(it);
            return '<div style="padding:6px 0;border-bottom:1px dashed #000"><div><b>' + (it.qty || 1) + 'x ' + esc(itemLabel(it)) + '</b></div>'
                + lines.map(function (l) { return '<div style="font-size:12px">' + esc(l) + '</div>'; }).join('') + '</div>';
        }).join('')
        : '<div style="padding:4px 0">' + esc(o.summary || '') + '</div>';
    var html = '<!doctype html><html><head><meta charset="utf-8"><title>Ticket ' + esc(o.ref) + '</title>'
        + '<style>body{font-family:monospace;width:280px;margin:0 auto;padding:16px;color:#000}h1{font-size:16px;margin:0 0 4px}.hr{border-top:1px dashed #000;margin:8px 0}</style></head><body>'
        + '<h1>SND//WCH — COCINA</h1><div>REF: ' + esc(o.ref) + '</div><div>' + esc(o.date || '') + '</div><div class="hr"></div>'
        + items
        + '<div class="hr"></div>' + (o.notes ? '<div><b>NOTA:</b> ' + esc(o.notes) + '</div>' : '')
        // customer_rank se guarda en el pedido al momento de crearse (ver finalizeAndInsertOrder/
        // orders.ts) — solo para los 2 rangos más altos vale la pena un toque especial en
        // cocina; para el resto no aporta nada que el operador necesite ver.
        + ((o.customer_rank === 'CÍRCULO INTERNO' || o.customer_rank === 'MESA FUNDADORA') ? '<div class="hr"></div><div style="display:flex;align-items:center;gap:5px">' + icon('crown', 13) + '<span>Cliente ' + esc(o.customer_rank) + ' — ' + esc(o.customer_name || '') + '. ¡Gracias por su preferencia!</span></div>' : '')
        + '<script>window.onload=function(){window.print();}<\/script></body></html>';
    var w = window.open('', '_blank', 'width=340,height=600');
    if (!w) {
        showToast('El navegador bloqueó la ventana de impresión.');
        return;
    }
    w.document.write(html);
    w.document.close();
}

function DHERO(label, big, sub) {
    return '<div style="background:linear-gradient(135deg,rgba(203,162,88,.16),rgba(203,162,88,.05));border:1px solid rgba(203,162,88,.5);border-radius:14px;padding:20px 18px;box-shadow:0 4px 22px rgba(203,162,88,.14)"><div style="font-family:EB Garamond,serif;font-weight:600;font-size:10px;color:' + GOLD + ';letter-spacing:.2em;margin-bottom:8px">' + label + '</div><div style="font-family:Bodoni Moda,serif;font-optical-sizing:auto;font-size:42px;font-weight:640;color:var(--sw-text,#FFFFFF);line-height:1">' + big + '</div>' + (sub ? '<div style="font-family:EB Garamond,serif;font-weight:600;font-size:10px;color:' + GOLD + ';margin-top:6px">' + sub + '</div>' : '') + '</div>';
}
function DBAR(label, value, max, color) {
    var pct = max > 0 ? Math.min(100, Math.round((value / max) * 100)) : 0;
    return '<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-family:EB Garamond,serif;font-size:12px;color:var(--sw-text-body,#F2F0EB)">' + label + '</span><span style="font-family:EB Garamond,serif;font-style:italic;font-size:11px;color:' + (color || GOLD) + '">' + value + '</span></div><div style="background:var(--sw-bg,#1E3932);border-radius:4px;height:8px;overflow:hidden"><div style="background:' + (color || GOLD) + ';height:100%;width:' + pct + '%;border-radius:4px"></div></div></div>';
}
function sAdminDashboard() {
    var h = H('PANEL DE NEGOCIO', "loadAdmin()") + '<div style="flex:1;padding:20px 20px 40px;overflow-y:auto" class="fi">';
    if (!dashStats) {
        h += '<div style="text-align:center;padding-top:64px"><div style="font-family:EB Garamond,serif;font-weight:600;font-size:10px;color:#ff8888;letter-spacing:.2em">No se pudo cargar //</div></div>' + BTN('Reintentar //', 'loadDashboard()');
        return h + '</div>';
    }
    var d = dashStats;
    // Alertas
    var alerts = [];
    if (d.pendingPayment > 0)
        alerts.push(d.pendingPayment + ' pedido(s) sin pago confirmado (posible prueba o error de checkout)');
    if (d.outOfStock && d.outOfStock.length)
        alerts.push(d.outOfStock.length + ' producto(s) sin stock: ' + d.outOfStock.map(function (o) { return o.product_name || o.product_code; }).join(', '));
    if (d.lowStock && d.lowStock.length)
        alerts.push('Stock bajo: ' + d.lowStock.map(function (o) { return (o.product_name || o.product_code) + ' (' + o.stock_qty + ')'; }).join(', '));
    if (d.trendTruncated)
        alerts.push('Hay tantos pedidos en el período reciente que la tendencia y los productos top de abajo no cubren todo el rango esperado.');
    if (alerts.length) {
        h += '<div style="background:rgba(255,165,0,.1);border:1px solid rgba(255,165,0,.3);border-radius:10px;padding:14px 16px;margin-bottom:18px">'
            + '<div style="font-family:EB Garamond,serif;font-weight:600;font-size:9px;color:#ffa500;letter-spacing:.15em;margin-bottom:6px">Alertas //</div>'
            + alerts.map(function (a) { return '<div style="font-family:EB Garamond,serif;font-size:12px;color:var(--sw-text-body,#F2F0EB);margin-bottom:4px;display:flex;align-items:center;gap:5px">' + icon('warning', 12, '#ffa500') + '<span>' + esc(a) + '</span></div>'; }).join('')
            + '</div>';
    }
    // Ventas
    h += '<div style="font-family:EB Garamond,serif;font-weight:600;font-size:9px;color:' + GOLD + ';letter-spacing:.2em;margin-bottom:10px">Ventas //</div>';
    // Antes había que comparar los números a mano contra la semana/mes pasado — el dato
    // del período anterior ya se calcula en el servidor, esto solo arma el "+X% vs antes".
    function deltaTxt(pct) {
        if (pct == null)
            return '';
        var arrow = pct > 0 ? '▲' : pct < 0 ? '▼' : '●';
        var color = pct > 0 ? '#25D366' : pct < 0 ? '#ff8888' : '#A8C8B0';
        return ' · <span style="color:' + color + '">' + arrow + ' ' + (pct > 0 ? '+' : '') + pct + '% vs. antes</span>';
    }
    h += '<div style="margin-bottom:10px">' + DHERO('Hoy', SOLES + d.revenue.today.revenue, d.revenue.today.count + ' pedidos · tkt ' + SOLES + d.revenue.today.avgTicket) + '</div>';
    h += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px">'
        + DTILE('Semana', SOLES + d.revenue.week.revenue, d.revenue.week.count + ' pedidos · tkt ' + SOLES + d.revenue.week.avgTicket + deltaTxt(d.deltas && d.deltas.weekRevenuePct), true)
        + DTILE('Mes', SOLES + d.revenue.month.revenue, d.revenue.month.count + ' pedidos · tkt ' + SOLES + d.revenue.month.avgTicket + deltaTxt(d.deltas && d.deltas.monthRevenuePct), true)
        + DTILE('Total', SOLES + d.revenue.allTime.revenue, d.revenue.allTime.count + ' pedidos · tkt ' + SOLES + d.revenue.allTime.avgTicket, true)
        + '</div>';
    // Ganancia estimada = ingresos × (1 - costo de insumos ~40-50%, ver COGS_LOW/HIGH en
    // admin.ts) — siempre como rango, nunca como cifra exacta, porque no hay costo real
    // por receta en el sistema (solo precio de venta).
    if (d.estimatedProfit) {
        h += '<div style="background:rgba(37,211,102,.08);border:1px solid rgba(37,211,102,.25);border-radius:10px;padding:14px 16px;margin-bottom:18px">'
            + '<div style="font-family:EB Garamond,serif;font-weight:600;font-size:9px;color:#25D366;letter-spacing:.15em;margin-bottom:8px">Ganancia estimada (rango, no exacta) //</div>'
            + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'
            + [['Hoy', d.estimatedProfit.today], ['Semana', d.estimatedProfit.week], ['Mes', d.estimatedProfit.month], ['Total', d.estimatedProfit.allTime]].map(function (x) {
                return '<div><div style="font-family:EB Garamond,serif;font-weight:600;font-size:8px;color:var(--sw-text-muted,#A8C8B0);letter-spacing:.1em">' + x[0] + '</div><div style="font-family:Bodoni Moda,serif;font-optical-sizing:auto;font-size:16px;font-weight:640;color:#25D366">' + SOLES + x[1].low + '–' + SOLES + x[1].high + '</div></div>';
            }).join('')
            + '</div></div>';
    }
    if (d.codPending && d.codPending.count > 0) {
        h += '<div style="background:rgba(255,165,0,.08);border:1px solid rgba(255,165,0,.25);border-radius:10px;padding:14px 16px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center"><div><div style="font-family:EB Garamond,serif;font-weight:600;font-size:9px;color:#ffa500;letter-spacing:.15em">Por cobrar · contra entrega //</div><div style="font-family:EB Garamond,serif;font-size:12px;color:var(--sw-text-muted,#A8C8B0);margin-top:2px">' + d.codPending.count + ' pedido(s) sin cobrar todavía</div></div><div style="font-family:Bodoni Moda,serif;font-optical-sizing:auto;font-size:22px;font-weight:640;color:#ffa500">' + SOLES + d.codPending.total + '</div></div>';
    }
    // Tendencia 14 días
    if (d.trend && d.trend.length) {
        var trMax = Math.max.apply(null, d.trend.map(function (t) { return t.revenue; }).concat([1]));
        h += '<div style="font-family:EB Garamond,serif;font-weight:600;font-size:9px;color:' + GOLD + ';letter-spacing:.2em;margin-bottom:10px">Tendencia · 14 días //</div>';
        h += '<div style="display:flex;gap:3px;align-items:flex-end;height:70px;margin-bottom:6px">' + d.trend.map(function (t) { var pct = Math.round((t.revenue / trMax) * 100); return '<div style="flex:1;height:100%;display:flex;align-items:flex-end" title="' + t.date + ': S/' + t.revenue + '"><div style="width:100%;background:' + (t.revenue > 0 ? GOLD : 'var(--sw-card2,#1A3028)') + ';height:' + Math.max(pct, t.revenue > 0 ? 4 : 2) + '%;border-radius:2px 2px 0 0"></div></div>'; }).join('') + '</div>';
        h += '<div style="display:flex;gap:3px;margin-bottom:18px">' + d.trend.map(function (t, i) { return '<div style="flex:1;text-align:center;font-family:EB Garamond,serif;font-style:italic;font-size:6px;color:var(--sw-text-muted,#A8C8B0)">' + (i % 2 === 0 ? t.date : '') + '</div>'; }).join('') + '</div>';
    }
    // Pedidos por estado
    var stEntries = Object.keys(d.ordersByStatus || {});
    h += '<div style="font-family:EB Garamond,serif;font-weight:600;font-size:9px;color:' + GOLD + ';letter-spacing:.2em;margin-bottom:10px">Pedidos por estado //</div>';
    if (!stEntries.length) {
        h += '<div style="font-family:EB Garamond,serif;font-size:12px;color:var(--sw-text-muted,#A8C8B0);margin-bottom:16px">Sin pedidos todavía.</div>';
    }
    else {
        // ordersByStatus cuenta TODA la tabla histórica (ver dashboard_aggregates): ENTREGADO
        // crece sin límite mientras los estados en vivo — lo que de verdad hay que operar
        // AHORA — casi siempre son números chicos. Compartir una sola escala los volvía
        // invisibles junto a ENTREGADO (hallazgo de auditoría) — cada grupo ahora escala
        // contra su propio máximo.
        var LIVE_STATUSES = ['RECIBIDO', 'PREPARANDO', 'EN CAMINO'];
        var liveEntries = LIVE_STATUSES.filter(function (k) { return k in d.ordersByStatus; });
        var doneEntries = stEntries.filter(function (k) { return LIVE_STATUSES.indexOf(k) === -1; });
        if (liveEntries.length) {
            var liveMax = Math.max.apply(null, liveEntries.map(function (k) { return d.ordersByStatus[k]; }).concat([1]));
            h += '<div style="font-family:EB Garamond,serif;font-weight:600;font-size:8px;color:var(--sw-text-muted,#A8C8B0);letter-spacing:.1em;margin-bottom:6px">En curso ahora //</div>';
            h += liveEntries.map(function (k) { return DBAR((STATUSES[k] || {}).label || k, d.ordersByStatus[k], liveMax, (STATUSES[k] || {}).c); }).join('');
        }
        if (doneEntries.length) {
            var doneMax = Math.max.apply(null, doneEntries.map(function (k) { return d.ordersByStatus[k]; }).concat([1]));
            h += '<div style="font-family:EB Garamond,serif;font-weight:600;font-size:8px;color:var(--sw-text-muted,#A8C8B0);letter-spacing:.1em;margin:10px 0 6px">Histórico //</div>';
            h += doneEntries.map(function (k) { return DBAR((STATUSES[k] || {}).label || k, d.ordersByStatus[k], doneMax, (STATUSES[k] || {}).c); }).join('');
        }
    }
    if (d.avgEtaMinutes != null) {
        h += '<div style="margin-top:10px">' + DTILE('Tiempo estimado promedio ofrecido', d.avgEtaMinutes + ' min', 'Cuando se marca "EN CAMINO"') + '</div>';
    }
    h += '<div style="height:1px;background:var(--sw-bg,#1E3932);margin:16px 0"></div>';
    // Productos top
    h += '<div style="font-family:EB Garamond,serif;font-weight:600;font-size:9px;color:' + GOLD + ';letter-spacing:.2em;margin-bottom:10px">Productos más vendidos //</div>';
    if (d.topProducts && d.topProducts.length) {
        var pMax = Math.max.apply(null, d.topProducts.map(function (p) { return p.count; }).concat([1]));
        h += d.topProducts.map(function (p) {
            var pct = Math.round((p.count / pMax) * 100);
            return '<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-family:Bodoni Moda,serif;font-optical-sizing:auto;font-size:14px;font-weight:600;color:var(--sw-text,#FFFFFF)">' + esc(p.name) + '</span><span style="font-family:EB Garamond,serif;font-style:italic;font-size:11px;color:' + GOLD + '">' + p.count + ' vendidos · ' + SOLES + p.revenue + '</span></div><div style="background:var(--sw-bg,#1E3932);border-radius:4px;height:8px;overflow:hidden"><div style="background:' + GOLD + ';height:100%;width:' + pct + '%;border-radius:4px"></div></div></div>';
        }).join('');
    }
    else {
        h += '<div style="font-family:EB Garamond,serif;font-size:12px;color:var(--sw-text-muted,#A8C8B0);margin-bottom:16px">Aún no hay ventas pagadas para rankear productos.</div>';
    }
    h += '<div style="height:1px;background:var(--sw-bg,#1E3932);margin:16px 0"></div>';
    // Clientes
    h += '<div style="font-family:EB Garamond,serif;font-weight:600;font-size:9px;color:' + GOLD + ';letter-spacing:.2em;margin-bottom:10px">Clientes //</div>';
    h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">'
        + DTILE('Total', d.customers.total)
        + DTILE('Recurrentes', d.customers.returning, '>1 pedido')
        + DTILE('Nuevos · semana', d.customers.newThisWeek)
        + DTILE('Nuevos · mes', d.customers.newThisMonth)
        // ROI del programa de referidos — antes no había ninguna forma de ver si el bono
        // de 50 puntos por referido realmente atrae clientes/ingresos.
        + (d.referrals ? DTILE('Clientes referidos', d.referrals.referredCustomers, SOLES + d.referrals.revenue + ' en ventas') : '')
        + '</div>';
    if (d.peakHours && d.peakHours.length) {
        var peakTop = d.peakHours.slice().sort(function (a, b) { return b.count - a.count; })[0];
        var peakDayNames = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
        var peakDayTop = d.peakDays && d.peakDays.length ? d.peakDays.slice().sort(function (a, b) { return b.count - a.count; })[0] : null;
        h += '<div style="font-family:EB Garamond,serif;font-style:italic;font-size:9px;color:var(--sw-text-muted,#A8C8B0);margin-bottom:14px;display:flex;align-items:center;gap:5px"><span style="display:inline-flex;align-items:center;gap:5px">' + icon('reportes', 12, '#A8C8B0') + '<span>Hora pico (últimos 90 días): </span></span><b style="color:var(--sw-text,#FFFFFF)">' + peakTop.hour + ':00-' + (peakTop.hour + 1) + ':00</b>' + (peakDayTop ? ' · Día pico: <b style="color:var(--sw-text,#FFFFFF)">' + peakDayNames[peakDayTop.dow] + '</b>' : '') + '</div>';
    }
    // Confirmados vs. abandonados por Yape/Plin — antes no había forma de ver de un
    // vistazo qué tan seguido un pedido con este método SÍ termina transfiriéndose vs.
    // cuántos se cancelan por no confirmarse a tiempo (mismo cron de 3h que expira un
    // pago manual sin confirmar).
    if (d.yapePlin && d.yapePlin.total > 0) {
        var ypRate = Math.round((d.yapePlin.confirmed / d.yapePlin.total) * 100);
        h += '<div style="background:var(--sw-card,#2D5246);border:1px solid var(--sw-border,#3A6B58);border-radius:10px;padding:14px 16px;margin-bottom:14px"><div style="font-family:EB Garamond,serif;font-weight:600;font-size:9px;color:' + GOLD + ';letter-spacing:.2em;margin-bottom:10px">Yape/Plin — confirmados vs. abandonados //</div><div style="display:flex;gap:8px"><div style="flex:1;text-align:center;background:var(--sw-card2,#1A3028);border-radius:8px;padding:8px"><div style="font-family:\'Bodoni Moda\',serif;font-optical-sizing:auto;font-size:22px;font-weight:640;color:#25D366">' + d.yapePlin.confirmed + '</div><div style="font-family:EB Garamond,serif;font-weight:600;font-size:8px;color:var(--sw-text-muted,#A8C8B0);letter-spacing:.05em">Confirmados</div></div><div style="flex:1;text-align:center;background:var(--sw-card2,#1A3028);border-radius:8px;padding:8px"><div style="font-family:\'Bodoni Moda\',serif;font-optical-sizing:auto;font-size:22px;font-weight:640;color:#ff5555">' + d.yapePlin.abandoned + '</div><div style="font-family:EB Garamond,serif;font-weight:600;font-size:8px;color:var(--sw-text-muted,#A8C8B0);letter-spacing:.05em">Abandonados</div></div><div style="flex:1;text-align:center;background:var(--sw-card2,#1A3028);border-radius:8px;padding:8px"><div style="font-family:\'Bodoni Moda\',serif;font-optical-sizing:auto;font-size:22px;font-weight:640;color:' + GOLD + '">' + ypRate + '%</div><div style="font-family:EB Garamond,serif;font-weight:600;font-size:8px;color:var(--sw-text-muted,#A8C8B0);letter-spacing:.05em">Tasa confirm.</div></div></div></div>';
    }
    // Origen de campaña (?src=... en el link del anuncio) — sin esto no hay forma de saber
    // si una campaña paga se está pagando sola. "convertidos" cuenta solo a quien ya hizo al
    // menos un pedido, no solo se registró.
    if (d.bySource && d.bySource.length) {
        h += '<div style="margin-bottom:16px"><div style="font-family:EB Garamond,serif;font-weight:600;font-size:9px;color:' + GOLD + ';letter-spacing:.2em;margin-bottom:10px">Origen de clientes //</div>'
            // recentRevenue/recentAvgTicket cubren solo la ventana reciente del dashboard
            // (~14-31 días, misma que topProducts/trend), no ingresos históricos totales por
            // fuente — por eso solo se muestran cuando hay algo que mostrar (>0), en vez de
            // sugerir un $0 que en realidad es "sin pedidos EN ESTA VENTANA".
            + d.bySource.map(function (s) { return '<div style="display:flex;justify-content:space-between;align-items:center;background:var(--sw-card,#2D5246);border-radius:8px;padding:8px 12px;margin-bottom:6px"><span style="font-family:EB Garamond,serif;font-size:12px;color:var(--sw-text-body,#F2F0EB)">' + esc(s.source) + '</span><span style="font-family:EB Garamond,serif;font-style:italic;font-size:10px;color:var(--sw-text-muted,#A8C8B0);text-align:right">' + s.signups + ' registrados · <span style="color:' + GOLD + '">' + s.converted + ' pidieron</span>' + (s.recentRevenue > 0 ? '<br>S/' + s.recentRevenue.toFixed(0) + ' · ticket S/' + s.recentAvgTicket.toFixed(2) + ' (últimos días)' : '') + '</span></div>'; }).join('')
            + '</div>';
    }
    var tiers = d.customers.tiers || {};
    // VIP se retiró como tier — ya no hay un multiplicador de puntos distinto por nivel,
    // así que ya no tiene sentido mostrarlo como un bucket aparte en este gráfico.
    var tMax = Math.max(tiers.FREQUENT || 0, tiers.REGULAR || 0, tiers.MEMBER || 0, 1);
    h += DBAR('Frequent', tiers.FREQUENT || 0, tMax, GOLD) + DBAR('Regular', tiers.REGULAR || 0, tMax, '#7FA894') + DBAR('Member', tiers.MEMBER || 0, tMax, '#4A6B5A');
    h += '<div style="height:1px;background:var(--sw-bg,#1E3932);margin:16px 0"></div>';
    // Clientes en riesgo de fuga — priorizados por días sin pedir Y rango (perder a alguien
    // de MESA FUNDADORA pesa más que perder a alguien NUEVO). No reemplaza los recordatorios
    // automáticos (remind-second-order/remind-high-rank-winback), es para que el dueño
    // decida a quién más vale la pena escribirle personalmente.
    h += '<div style="font-family:EB Garamond,serif;font-weight:600;font-size:9px;color:' + GOLD + ';letter-spacing:.2em;margin-bottom:10px">Clientes en riesgo //</div>';
    if (atRiskCustomers && atRiskCustomers.length) {
        h += atRiskCustomers.slice(0, 10).map(function (c, i) {
            var daysTxt = c.daysSinceLastOrder == null ? 'nunca pagó un pedido' : 'hace ' + c.daysSinceLastOrder + ' días';
            return '<div style="display:flex;justify-content:space-between;align-items:center;background:var(--sw-card,#2D5246);border:1px solid var(--sw-border,#3A6B58);border-radius:8px;padding:10px 14px;margin-bottom:8px"><div><div style="font-family:\'Bodoni Moda\',serif;font-optical-sizing:auto;font-size:13px;font-weight:600;color:var(--sw-text,#FFFFFF)">' + esc(c.name || c.phone) + '</div><div style="font-family:EB Garamond,serif;font-style:italic;font-size:9px;color:var(--sw-text-muted,#A8C8B0);margin-top:2px">' + esc(c.rank) + ' · último pedido ' + daysTxt + '</div></div><button onclick="waRiskContact(' + i + ')" aria-label="Contactar por WhatsApp" style="all:unset;cursor:pointer;background:rgba(203,162,88,.12);border:1px solid rgba(203,162,88,.4);color:' + GOLD + ';font-family:\'Bodoni Moda\',serif;font-optical-sizing:auto;font-size:11px;font-weight:600;padding:8px 12px;border-radius:8px;flex-shrink:0;display:inline-flex">' + icon('chat', 14, GOLD) + '</button></div>';
        }).join('');
    }
    else {
        h += '<div style="font-family:EB Garamond,serif;font-size:12px;color:var(--sw-text-muted,#A8C8B0);margin-bottom:14px">Sin clientes en riesgo por ahora.</div>';
    }
    h += '<div style="height:1px;background:var(--sw-bg,#1E3932);margin:16px 0"></div>';
    // Puntos
    h += '<div style="font-family:EB Garamond,serif;font-weight:600;font-size:9px;color:' + GOLD + ';letter-spacing:.2em;margin-bottom:10px">Puntos //</div>';
    h += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:8px">'
        + DTILE('Emitidos', d.points.issued)
        + DTILE('Canjeados', d.points.redeemed)
        + DTILE('En circulación', d.points.outstanding, undefined, true)
        + '</div>';
    h += '<div style="height:1px;background:var(--sw-bg,#1E3932);margin:16px 0"></div>';
    h += '<div style="font-family:EB Garamond,serif;font-weight:600;font-size:9px;color:' + GOLD + ';letter-spacing:.2em;margin-bottom:10px">Exportar //</div>';
    h += '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px">'
        + '<button onclick="exportCsv(\'export-orders\',\'pedidos\')" style="all:unset;cursor:pointer;background:var(--sw-card,#2D5246);border:1px solid var(--sw-border,#3A6B58);color:' + GOLD + ';font-family:\'Bodoni Moda\',serif;font-optical-sizing:auto;font-size:13px;font-weight:600;padding:12px;border-radius:8px;text-align:center">Exportar pedidos (CSV) //</button>'
        + '<button onclick="exportCsv(\'export-customers\',\'clientes\')" style="all:unset;cursor:pointer;background:var(--sw-card,#2D5246);border:1px solid var(--sw-border,#3A6B58);color:' + GOLD + ';font-family:\'Bodoni Moda\',serif;font-optical-sizing:auto;font-size:13px;font-weight:600;padding:12px;border-radius:8px;text-align:center">Exportar clientes (CSV) //</button>'
        + '</div>';
    h += BTN('Actualizar //', 'loadDashboard()', true);
    h += '</div>';
    return h;
}
function toCsv(rows) {
    if (!rows || !rows.length)
        return '';

        btn.disabled = false;
    } }

        if (err && err.code === 1)
            msg = 'Bloqueaste el permiso de ubicación, o estás dentro de una app como WhatsApp que no deja usar el GPS. Toca los tres puntos → "Abrir en el navegador", o arrastra el mapa manualmente.';
        else if (err && err.code === 2)
            msg = 'Tu dispositivo no pudo determinar tu ubicación. Arrastra el mapa hasta tu dirección.';
        else if (err && err.code === 3)
            msg = 'La búsqueda de ubicación tardó demasiado. Arrastra el mapa hasta tu dirección.';
        setGpsHint(msg);
        openMap(-8.1120, -79.0290, true);
    }

        fail();
        return;
    }
    if (btn) {
        btn.innerHTML = '<span class="sp">&#8635;</span>';
        btn.disabled = true;
    }

        // Antes de rendirnos, reintentamos una vez con precisión más baja (mucho más rápida).
        if (err && err.code === 3) {

// <div onclick> (tarjetas de Signature, chips de bebida, filas de dirección...): el
// navegador no los ve como controles, así que no se podían enfocar ni activar con teclado
// y un lector de pantalla los leía como texto suelto. Marcarlos acá, después de cada
// render, en vez de reescribir las ~60 etiquetas a mano: no toca ni una línea del HTML
// generado (cero riesgo de romper una plantilla) y cubre también las que se agreguen
// después. La regla de foco visible ya existe en shell.html para cursor:pointer.
function makeClickablesAccessible() {
    var nodes = document.querySelectorAll('[onclick]');
    for (var i = 0; i < nodes.length; i++) {
        var el = nodes[i];
        var tag = el.tagName;
        if (tag === 'BUTTON' || tag === 'A' || tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || tag === 'LABEL')
            continue;
        if (el.hasAttribute('tabindex'))
            continue;
        el.setAttribute('tabindex', '0');
        if (!el.hasAttribute('role'))
            el.setAttribute('role', 'button');

    if (el.tagName === 'BUTTON' || el.tagName === 'A' || el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')

    if (el.getAttribute('role') !== 'button')
        return;
    e.preventDefault();

// cambiar un precio requería editar el número hardcodeado aquí Y redesplegar el sitio.
// Muta PROTS/SIGS/SIDES/RWDS en el sitio en vez de cambiar cómo se leen en el resto del
// archivo, así el resto del pricing/checkout sigue funcionando igual.
async function loadCatalogBackground() {
    try {
        var r = await api('get-catalog', {});
        PROTS.forEach(function (p) { var v = r.proteins && r.proteins[p.id]; if (v) {
            p.p15 = v.p15;
            p.p30 = v.p30;
            p.pDbl = v.pDbl;
            if (typeof v.pDbl30 === 'number')
                p.pDbl30 = v.pDbl30;
        } });
        SIGS.forEach(function (s) { var v = r.sigs && r.sigs[s.id]; if (v) {
            s.p15 = v.p15;
            s.p30 = v.p30;
        } });
        // Signatures públicos editables desde el panel (2026-08-27). Antes de esto, `r.sigs`
        // solo traía precios: el nombre, el badge, el pitch, la foto y la composición vivían
        // como literales en el array SIGS de arriba, así que cambiar cualquiera de esos exigía
        // recompilar y desplegar. Ahora `r.sigItems` trae el ítem COMPLETO desde la tabla
        // `catalog_items` y este bloque lo vuelca sobre la entrada que ya existe en SIGS —
        // exactamente el mismo mecanismo que ya usaba el menú secreto abajo.
        //
        // El literal de SIGS pasa a ser SEMILLA: lo que se ve en el primer render, antes de que
        // este fetch resuelva, y el respaldo si el servidor no responde. Nunca lo edites para
        // cambiar el menú.
        if (r.sigItems) {
            Object.keys(r.sigItems).forEach(function (id) {
                var v = r.sigItems[id];
                if (!v)
                    return;
                var sig = SIGS.find(function (x) { return x.id === id; });
                if (!sig)
                    return;
                if (v.n)
                    sig.n = v.n;
                if (v.s)
                    sig.s = v.s;
                // badge y pitch pueden quedar vacíos a propósito (un Signature sin badge), así que
                // se copian aunque vengan en blanco — usar `if(v.badge)` haría imposible QUITAR un
                // badge desde el panel, que es justo una de las cosas que se quiere poder hacer.
                if (typeof v.badge === 'string')
                    sig.badge = v.badge;
                if (typeof v.pitch === 'string' && v.pitch)
                    sig.pitch = v.pitch;
                if (v.base)
                    sig.base = v.base;
                if (v.prot)
                    sig.prot = v.prot;
                if (Array.isArray(v.tops))
                    sig.tops = v.tops;
                if (Array.isArray(v.sauces))
                    sig.sauces = v.sauces;
                if (typeof v.p15 === 'number')
                    sig.p15 = v.p15;
                if (typeof v.p30 === 'number')
                    sig.p30 = v.p30;
                if (v.img)
                    SIG_IMG[id] = v.img;
                // Retirar un Signature del menú (lo que con THE CHICAGO costó una sesión de código)
                // ahora es publicar active=false desde el panel. La receta queda guardada en la
                // tabla para cuando vuelva.
                sig.retired = (v.active === false);
            });
            // Los retirados salen de la carta. Se filtra acá y no en cada pantalla para que
            // ninguna vista tenga que acordarse de hacerlo.
            for (var i = SIGS.length - 1; i >= 0; i--)
                if (SIGS[i].retired)
                    SIGS.splice(i, 1);
        }
        SIDES.forEach(function (d) { var v = r.sides && r.sides[d.id]; if (typeof v === 'number')
            d.p = v; });
        RWDS.forEach(function (rw) { var v = r.rewardPts && r.rewardPts[rw.id]; if (typeof v === 'number')
            rw.pts = v; });
        // Sándwich secreto con rotación mensual (decisión del dueño, 2026-08-10) — antes SIG05
        // era un literal fijo ('The Vault', Pollo Cajún) en el array de arriba. Ahora
        // r.secretSignature trae la composición vigente (nombre/pan/proteína/tops/salsas/
        // precio/minOrders) publicada desde Admin // Menú secreto, y este bloque la vuelca
        // sobre la misma entrada SIG05 ya presente en SIGS — el resto del código (vaultCard,
        // sigPreviewOverlayHTML, checkout) sigue leyendo esos mismos campos sin cambios.
        var secret = r.secretSignature;
        if (secret) {
            var secretSig = SIGS.find(function (s) { return s.id === 'SIG05'; });
            if (secretSig) {
                secretSig.n = secret.name;
                secretSig.base = secret.base;
                secretSig.prot = secret.prot;
                secretSig.tops = secret.tops;
                secretSig.sauces = secret.sauces;
                secretSig.p15 = secret.p15;
                secretSig.p30 = secret.p30;
                secretSig.minOrders = secret.minOrders;
            }
            // vaultOnly ya no es un flag fijo en PROTS/TOPS/SAUCES (ver comentarios junto a
            // P03/T04/S02/S12 arriba) — se recalcula en cada refresco a partir de qué ids
            // manda el servidor este ciclo, para que ARMA EL TUYO excluya exactamente lo que
            // el sándwich secreto de este mes reserva para sí, ni más ni menos.
            PROTS.forEach(function (p) { p.vaultOnly = (secret.vaultOnlyProts || []).indexOf(p.id) >= 0; });
            TOPS.forEach(function (t) { t.vaultOnly = (secret.vaultOnlyTops || []).indexOf(t.id) >= 0; });
            SAUCES.forEach(function (sauce) { sauce.vaultOnly = (secret.vaultOnlySauces || []).indexOf(sauce.id) >= 0; });
        }
    }
    catch (e) { }
}

async function saveSecretSignature() {
    ssName = gv('ss-name');
    ssImagePath = gv('ss-img');
    ssP15 = gv('ss-p15');
    ssP30 = gv('ss-p30');
    ssMinOrders = gv('ss-min');
    if (!ssName.trim()) {
        showToast('Falta el nombre del sándwich del mes.');
        return;
    }
    if (!ssBase || !ssProt) {
        showToast('Elige pan y proteína.');
        return;
    }
    // Al menos una salsa (no "un topping O una salsa"): el cargo de SALSA EXTRA duplica la
    // última salsa de la receta, así que una receta sin salsas dejaba ese extra sin ningún
    // ingrediente real detrás. El servidor ya lo rechaza; esto lo avisa antes de enviar.
    if (!ssSauces.length) {
        showToast('Elige al menos una salsa para la receta.');
        return;
    }
    if (!ssTops.length) {
        showToast('Elige al menos un topping.');
        return;
    }
    var p15 = Number(ssP15), p30 = Number(ssP30), minOrders = Number(ssMinOrders);
    if (!(p15 > 0) || !(p30 > 0)) {
        showToast('Precio inválido.');
        return;
    }
    if (!Number.isInteger(minOrders) || minOrders < 0) {
        showToast('Pedidos mínimos inválido.');
        return;
    }
    busy = true;
    busyMsg = 'Publicando...';
    render();
    try {
        await api('admin-secret-signature-set', { token: token, name: ssName.trim(), base: ssBase, proteinId: ssProt, tops: ssTops, sauces: ssSauces, vaultOnlyIds: ssVaultIds, price15: p15, price30: p30, minOrders: minOrders, imagePath: ssImagePath.trim() || null });
        await loadCatalogBackground();
        ssMsg = 'Sándwich del mes publicado.';
    }
    catch (e) {
        busy = false;
        render();
        showToast('Error: ' + e.message);
        return;
    }
    await loadSecretSignatureAdmin();
    setTimeout(function () { ssMsg = ''; if (sndScreen === 'admin_secret')
        render(); }, 2500);
}

// 20MB de tope (mismo límite que el backend, ver actAdminUploadRawVideo en social.ts) —
// a diferencia de handleCalendarImageFile, no hay compresión posible del lado del
// cliente para video, así que el clip ya debe llegar razonablemente liviano; si pesa de
// más, el mensaje de error pide comprimirlo antes en vez de fallar en silencio.
function handleRawVideoFile(ev) {
    var input = ev && ev.target;
    var file = input && input.files && input.files[0];
    if (input)
        input.value = '';
    if (!file)
        return;
    if (!/^video\/(mp4|quicktime)$/.test(file.type)) {
        showToast('Selecciona un video MP4 o MOV.');
        return;
    }
    if (file.size > 20 * 1024 * 1024) {
        showToast('El video pesa más de 20MB — comprímelo antes de subirlo.');
        return;
    }
    rawVideoUploading = true;
    render();
    var reader = new FileReader();
    reader.onload = async function () {
        var base64 = String(reader.result || '').split(',')[1] || '';
        try {
            await api('admin-upload-raw-video', { token: token, videoBase64: base64, mime: file.type });
            showToast('Clip subido — se procesa en la próxima sesión semanal.', 'success');
            await loadCalendar();
        }
        catch (e) {
            showToast(e.message || 'No se pudo subir el video.');
        }
        rawVideoUploading = false;
        render();
    };
    reader.onerror = function () { rawVideoUploading = false; showToast('No se pudo leer el archivo.'); render(); };
    reader.readAsDataURL(file);
}

// Publicación real en Instagram/Facebook (Meta Graph API) — ver actAdminPublishSocial en
// social.ts. La foto se comprime en el propio celular antes de subirla, mismo criterio
// que handleReceiptFile (canvas, máx. 1080px de lado, JPEG) — la API de Instagram exige
// una URL pública de imagen ya alojada, así que primero sube a Storage y recién después
// se puede publicar.
function handleCalendarImageFile(ev, id) {
    var input = ev && ev.target;
    var file = input && input.files && input.files[0];
    if (input)
        input.value = '';
    if (!file)
        return;
    if (!/^image\//.test(file.type)) {
        showToast('Selecciona una imagen.');
        return;
    }
    calImageUploadingId = id;
    render();
    var reader = new FileReader();
    reader.onload = function () {
        var img = new Image();
        img.onload = function () {
            var maxDim = 1080;
            var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
            var w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
            var canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            var ctx = canvas.getContext('2d');
            if (!ctx) {
                calImageUploadingId = null;
                showToast('No se pudo procesar la imagen.');
                render();
                return;
            }
            ctx.drawImage(img, 0, 0, w, h);
            var base64 = canvas.toDataURL('image/jpeg', .82).split(',')[1] || '';
            uploadCalendarImageBase64(id, base64);
        };
        img.onerror = function () { calImageUploadingId = null; showToast('No se pudo leer la imagen.'); render(); };
        img.src = String(reader.result || '');
    };
    reader.onerror = function () { calImageUploadingId = null; showToast('No se pudo leer el archivo.'); render(); };
    reader.readAsDataURL(file);
}

var SW_UPDATE_FLAG = '__shell-update-pending';

// Antes no había ninguna detección de modo sin conexión — cada acción fallaba por
// separado con su propio mensaje genérico en vez de un aviso único y proactivo.
// Teclado virtual abierto → esconder la barra fija de navegación. Medido con Playwright a
// 320x330 (alto típico de viewport con el teclado de Android abierto): la barra quedaba
// justo encima del campo de teléfono del checkout y tapaba el de nombre. visualViewport
// es la única API que reporta el alto REAL disponible cuando el teclado está arriba;

    window.visualViewport.addEventListener('resize', function () {

function haversineKm(lat1, lon1, lat2, lon2) {
    var R = 6371;
    var dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
// Chequeo de ubicación de una sola vez al abrir la app (no un rastreo continuo): si el

function checkNearbyStore() {
    if (_nearCheckDone)
        return;
    _nearCheckDone = true;

    if (localStorage.getItem('sw_near_dismissed') === today)
        return;
    if (!('geolocation' in navigator))
        return;
    navigator.geolocation.getCurrentPosition(function (pos) {
        var d = haversineKm(pos.coords.latitude, pos.coords.longitude, STORE_LAT, STORE_LON);
        if (d <= NEARBY_RADIUS_KM) {

            render();
        }

// NOTIFICACIONES PUSH — avisan cuando el pedido pasa a PREPARANDO/EN CAMINO/ENTREGADO,
// incluso con la app cerrada. Solo disponibles para clientes con cuenta (la suscripción
// se guarda ligada a tu teléfono) y requieren HTTPS (o localhost) + un navegador
// compatible con Push API.
function urlBase64ToUint8Array(base64String) {
    var padding = '='.repeat((4 - base64String.length % 4) % 4);
    var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    var rawData = atob(base64);
    var out = new Uint8Array(rawData.length);
    for (var i = 0; i < rawData.length; i++)
        out[i] = rawData.charCodeAt(i);
    return out;
}

        if (existing) {

    }

// cold start de la Edge Function + la vuelta Perú↔servidor) bloqueaba la pantalla de
// carga en CADA recarga, incluso para alguien que ya estaba con sesión iniciada. Ahora,

// Solo se bloquea con el spinner cuando no hay nada que mostrar todavía (primer login en

// ─── BLINDAJE DE FUNCIONES GLOBALES ────────────────────────────────────────────────
//
// Este archivo se sirve como <script> inline, así que cada función de nivel superior es
// una propiedad de `window`. `src/shell.html` carga además dos bundles minificados de
